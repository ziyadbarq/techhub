        --build-arg BASE_REGISTRY=me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo \
        --build-arg GIT_COMMIT=${commit_id} \
        --build-arg GIT_COMMIT_FULL=${CI_COMMIT_SHA} \
        --build-arg GIT_REF=${CI_COMMIT_REF_NAME} \
        --build-arg APP_VERSION=${version} \
        --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
        --build-arg IMAGE_TAG=${IMAGE_TAG} \
        --build-arg PIPELINE_ID=${CI_PIPELINE_ID} \
        --build-arg PIPELINE_URL=${CI_PIPELINE_URL} \
        --build-arg GITLAB_JOB_ID=${CI_JOB_ID} \
        --build-arg GITLAB_JOB_URL=${CI_JOB_URL} \
        --build-arg PROJECT_URL=${CI_PROJECT_URL} \
        --context $CI_PROJECT_DIR \
        --dockerfile Dockerfile \
        --destination ${FULL_IMAGE_NAME}
    - mv .dockerignore.tmp .dockerignore
    - echo "${FULL_IMAGE_NAME}"
    - echo "FULL_IMAGE_NAME=${FULL_IMAGE_NAME}" > build_info.env
    - echo "IMAGE_FOR_UAT=${FULL_IMAGE_NAME}" >> build_info.env
