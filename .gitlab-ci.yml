# GitLab CI/CD Pipeline for TechHub
# Next.js 16 + Prisma 7 + PostgreSQL + Redis
# Kubernetes deployment via GitOps (ArgoCD) on GCP cloud
#
# ====================
# AUTOMATED WORKFLOW
# ====================
#
# Branch-based automation:
#   • dev branch  → build_only (validates + builds Docker image, NO deployment)
#   • main branch → build_and_deploy to GCP production
#
# Manual triggers (GitLab UI):
#   • Still available for custom builds/deployments
#   • Operation type: build_only or build_and_deploy
#
# Performance optimizations:
#   • Intelligent caching based on package-lock.json
#   • node_modules, .npm, and .next/cache shared across jobs
#   • Typical speedup: 2-3x faster builds after first run
#
# ====================

variables:
  type:
    description: "Select your desired operation"
    value: "build_only"
    options:
      - "build_only"
      - "build_and_deploy"

  CLOUD:
    description: "Select on which cloud you need to deploy"
    value: "gcp"
    options:
      - "gcp"

  npm_migration:
    description: "Select the flag true to run Prisma migrations"
    value: "false"
    options:
      - "true"
      - "false"

  # Project configuration
  PROJECT: "techhub"
  AUTOMATIC_TRIGGER_BRANCH: main
  DEV_BRANCH: dev
  DEV_ENV: dev
  UAT_ENV: uat
  TEST_ENV: test
  PERF_ENV: perf

  # Cache configuration
  NPM_CACHE_DIR: "$CI_PROJECT_DIR/.npm"
  # NPM network resiliency (mitigates transient ECONNRESET issues)
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
  NPM_CONFIG_NETWORK_TIMEOUT: "600000"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_PROGRESS: "false"
  NPM_CONFIG_LOGLEVEL: "warn"

  # ============================================================================
  # Build-time variables — stored in GitLab CI/CD project settings, NOT here.
  # Go to: Settings > CI/CD > Variables
  #
  #   DATABASE_URL   — CI database connection string (masked; protected only if branch policy allows it)
  #                    Required for: npx prisma validate in the validate stage
  #   ENCRYPTION_KEY — 64 hex chars AES-256-GCM key (masked; protected only if branch policy allows it)
  #                    Required for: validate stage check
  #
  # Runtime variables (DATABASE_URL, REDIS_URL, BETTER_AUTH_*, etc.) are loaded
  # from Spring Cloud Config Server at pod startup via instrumentation.ts.
  # See: docs/infrastructure/SPRING_CLOUD_CONFIG.md
  # ============================================================================

  # GCP Variables
  DEV_CNTNR_GCP_REG_IMG_PREFIX: "me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo"
  DEV_GCP_LAB_TAG: globalnodegcp
  DEV_OCI_LAB_TAG: globalnodeoci
  DEV_CNTNR_OCI_REG_IMG_PREFIX: jed.ocir.io/axbp9ow0rohq
  DEV_OCI_IMAGE: jed.ocir.io/axbp9ow0rohq/gitlab-runner-node-22-alpine
  DEV_GCP_VALUES: values-gcpdev.yaml
  DEV_GCP_IMAGE: me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo/gitlab-runner-node-22-alpine:latest

  # UAT GCP VARIABLES
  UAT_CNTNR_GCP_REG_IMG_PREFIX: "me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo"
  UAT_GCP_LAB_TAG: globalnodegcp
  UAT_GCP_VALUES: values-gcpuat.yaml
  UAT_GCP_IMAGE: me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo/gitlab-runner-node-22-alpine:latest

stages:
  - validate
  - build_only
  - build_and_deploy
  - image-promotion

# Shared build cache for non-validate jobs
.build_cache: &build_cache
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .npm/
    - .next/cache/
  policy: pull

# Shared build metrics collection for build-only jobs
.build_metrics_after_script: &build_metrics_after_script
  - echo "📊 Build Metrics (${BUILD_METRICS_LABEL})" | tee ${BUILD_METRICS_FILE}
  - echo "Job Duration:${CI_JOB_DURATION}s" | tee -a ${BUILD_METRICS_FILE}
  - echo "Pipeline:${CI_PIPELINE_ID}" | tee -a ${BUILD_METRICS_FILE}
  - echo "Commit:${CI_COMMIT_SHORT_SHA}" | tee -a ${BUILD_METRICS_FILE}
  - if [ -d .next ]; then echo "Next.js build size:$(du -sh .next | cut -f1)" | tee -a ${BUILD_METRICS_FILE}; echo "Static files:$(du -sh .next/static 2>/dev/null | cut -f1 || echo N/A)" | tee -a ${BUILD_METRICS_FILE}; fi
  - if [ -d node_modules ]; then echo "node_modules size:$(du -sh node_modules | cut -f1)" | tee -a ${BUILD_METRICS_FILE}; fi

# ====================
# Stage 1: Validation (Type-check, Lint, Unit Tests)
# ====================
# CRITICAL: This stage MUST run before builds to catch issues early

validate:
  image: $DEV_GCP_IMAGE
  stage: validate
  tags:
    - $DEV_GCP_LAB_TAG
  cache:
    # Cache based on package-lock.json to invalidate on dependency changes
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
      - .next/cache/
    policy: pull-push
  before_script:
    - cp /.npmrc .
    - echo "📦 Installing dependencies..."
    # Enable pipefail when available to catch npm ci failures (prevents tee from masking errors)
    - set -o pipefail 2>/dev/null || true
    - time npm ci --prefer-offline --cache $NPM_CACHE_DIR 2>&1 | tee npm-install.log
    - echo "✅ Validating Prisma schema..."
    - npx prisma validate
    - npm run db:generate
  script:
    # Validate CRITICAL environment variables only
    # Other vars have defaults (see env.ts and better-auth.ts)
    - echo "Validating critical environment variables..."
    - test -n "$DATABASE_URL" || (echo "❌ ERROR DATABASE_URL not set" && exit 1)
    - test -n "$ENCRYPTION_KEY" || (echo "❌ ERROR ENCRYPTION_KEY not set" && exit 1)
    - echo "✅ Critical environment variables are set"

    # Run type-check, lint, and tests
    - echo "Running type-check..."
    - npm run type-check
    - echo "Running lint..."
    - npm run lint
    - echo "✅ Validation complete"
  after_script:
    - echo "📊 Collecting build metrics..."
    - echo "Job Duration:${CI_JOB_DURATION}s" | tee build-metrics.txt
    - echo "Pipeline ID:${CI_PIPELINE_ID}" | tee -a build-metrics.txt
    - echo "Commit:${CI_COMMIT_SHORT_SHA}" | tee -a build-metrics.txt
    - echo "Branch:${CI_COMMIT_BRANCH}" | tee -a build-metrics.txt
    - if [ -f npm-install.log ]; then grep "added.*packages" npm-install.log | tee -a build-metrics.txt || echo "npm install time unavailable" | tee -a build-metrics.txt; fi
    - if [ -d node_modules ]; then echo "node_modules size:$(du -sh node_modules | cut -f1)" | tee -a build-metrics.txt; fi
  rules:
    # Skip validation when only CI/deployment/docs files changed
    - if: '$CI_PIPELINE_SOURCE == "push"'
      changes:
        - .gitlab-ci.yml
        - Dockerfile
        - .dockerignore
        - docs/**/*
        - "*.md"
      when: never
    # Run validation on ALL other changes
    - when: on_success
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
      - build-metrics.txt
      - npm-install.log
    expire_in: 30 days

# ====================
# Stage 2: Build Only
# ====================

build-gcp:
  timeout: 30m # Increased from 20m to accommodate cold builds
  image: $DEV_GCP_IMAGE
  stage: build_only
  variables:
    DOCKER_CONFIG: "/kaniko/.docker"
    BUILD_METRICS_LABEL: "GCP"
    BUILD_METRICS_FILE: "build-size-gcp.txt"
  cache:
    # Reuse cache from validate stage for faster builds
    <<: *build_cache
  rules:
    # Automatic: dev branch → build_only (GCP)
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      when: always
    # Manual: Web UI with build_only selected
    - if: '$CLOUD == "gcp" && $CI_PIPELINE_SOURCE == "web" && $type == "build_only"'
      when: always
    - when: never
  tags:
    - $DEV_GCP_LAB_TAG
  environment:
    name: $DEV_ENV
  before_script:
    # Set inotify file watch limit for Next.js/Turbopack
    # Note: max_user_instances defaults to 128 which is sufficient for Turbopack parallelism
    # Removed: max_user_instances=512 (was limiting parallelism)
    # Removed: sysctl -p (auto-applied in containers, adds 9s overhead)
    - echo fs.inotify.max_user_watches=524288 | tee -a /etc/sysctl.conf
    # ENCRYPTION_KEY must be set in GitLab CI/CD project variables (Settings > CI/CD > Variables)
  script:
    # Clone deployment-configs for Dockerfile
    - git clone --depth 1 http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - cp /.npmrc .

    # Install dependencies and build on runner (fast - native filesystem)
    # Using build:fast since type-check already ran in validate stage
    - npm ci --prefer-offline --cache $NPM_CACHE_DIR
    - npm run db:generate
    - npm run build:fast

    # Generate image tag
    - version=`jq -r '.version' package.json`
    - commit_id=`git rev-parse --short=6 HEAD`
    - mkdir -p package
    - cp -r /package/. package/ || echo "No shared packages to copy"

    # Temporarily modify .dockerignore to include build artifacts
    # Include: .next/, src/generated/
    # Exclude: Large unnecessary files (logs, tests, docs, etc)
    - mv .dockerignore .dockerignore.tmp
    - echo ".git/" > .dockerignore
    - echo ".npm/" >> .dockerignore
    - echo ".husky/" >> .dockerignore
    - echo "coverage/" >> .dockerignore
    - echo "docs/" >> .dockerignore
    - echo "roadmap/" >> .dockerignore
    - echo "*.md" >> .dockerignore
    - echo ".vscode/" >> .dockerignore
    - echo ".idea/" >> .dockerignore

    # Build with Kaniko (using pre-built artifacts from runner)
    - export IMAGE_TAG="${version}-${commit_id}-${CI_JOB_ID}"
    - export FULL_IMAGE_NAME="${DEV_CNTNR_GCP_REG_IMG_PREFIX}/${PROJECT}:${IMAGE_TAG}"
    - |
      /kaniko/executor \
        --cache=true \
        --cache-ttl=168h \
        --snapshot-mode=redo \
        --build-arg BASE_REGISTRY=me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo \
        --build-arg ENCRYPTION_KEY="${ENCRYPTION_KEY}" \
        --context $CI_PROJECT_DIR \
        --dockerfile Dockerfile \
        --destination ${FULL_IMAGE_NAME}

    # Restore original .dockerignore
    - mv .dockerignore.tmp .dockerignore

    - echo "${FULL_IMAGE_NAME}"
  after_script: *build_metrics_after_script
  artifacts:
    paths:
      - build-size-gcp.txt
    expire_in: 7 days
  needs:
    - job: validate
      artifacts: false
      optional: true


