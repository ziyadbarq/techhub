# ====================
# Stage 3: Build and Deploy to ArgoCD
# ====================

build-and-push-gcp-to-argo:
  timeout: 30m # Increased from 20m to accommodate cold builds
  image: $DEV_GCP_IMAGE
  stage: build_and_deploy
  variables:
    DOCKER_CONFIG: "/kaniko/.docker"
  cache:
    # Reuse cache from validate stage for faster builds
    <<: *build_cache
  rules:
    # Automatic: main branch → build_and_deploy (GCP)
    - if: '$CI_COMMIT_BRANCH == $AUTOMATIC_TRIGGER_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      when: always
    # Manual: Web UI with build_and_deploy selected
    - if: '$CLOUD == "gcp" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy" && $type != "build_only"'
      when: always
    - when: never
  tags:
    - $DEV_GCP_LAB_TAG
  environment:
    name: $DEV_ENV
  before_script:
    # Set inotify file watch limit for Next.js/Turbopack
    # Note: max_user_instances defaults to 128 which is sufficient for Turbopack parallelism
    # Removed: max_user_instances=512 (was limiting parallelism)
    # Removed: sysctl -p (auto-applied in containers, adds 9s overhead)
    - echo fs.inotify.max_user_watches=524288 | tee -a /etc/sysctl.conf
    # ENCRYPTION_KEY must be set in GitLab CI/CD project variables (Settings > CI/CD > Variables)
  script:
    # Clone deployment-configs for Dockerfile
    - git clone --depth 1 http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - cp /.npmrc .

    # Install dependencies and build on runner (fast - native filesystem)
    # Using build:fast since type-check already ran in validate stage
    - npm ci --prefer-offline --cache $NPM_CACHE_DIR
    - npm run db:generate
    - npm run build:fast

    # Generate image tag
    - version=`jq -r '.version' package.json`
    - commit_id=`git rev-parse --short=6 HEAD`
    - mkdir -p package
    - cp -r /package/. package/ || echo "No shared packages to copy"

    # Compute image name before Kaniko (needed for both ArgoCD update and Kaniko push)
    - export IMAGE_TAG="${version}-${commit_id}-${CI_JOB_ID}"
    - export FULL_IMAGE_NAME="${DEV_CNTNR_GCP_REG_IMG_PREFIX}/${PROJECT}:${IMAGE_TAG}"
    - export IMAGE_NAME="${FULL_IMAGE_NAME}"
    - export NPM_MIGRATION="${npm_migration}"

    # Update ArgoCD values.yaml BEFORE Kaniko (Kaniko destroys the filesystem, git/yq won't exist after)
    - cd deployment-configs && git checkout main
    - git config pull.rebase false
    - git pull http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - yq e -i ".deployment.imageName = strenv(IMAGE_NAME)" manifests/${PROJECT}/${DEV_GCP_VALUES}
    - yq e -i ".jobs.migrate.enabled = ${NPM_MIGRATION}" manifests/${PROJECT}/${DEV_GCP_VALUES}
    - cat manifests/${PROJECT}/${DEV_GCP_VALUES}
    - git config --global user.email "sdev@barq.com"
    - git config --global user.name ${GITLAB_UN}
    - git remote set-url origin "http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git"
    - git add manifests/${PROJECT}/${DEV_GCP_VALUES}
    - git commit -m "🚀 Update ${PROJECT} DEV image to ${IMAGE_TAG}"
    - git push origin -o ci.skip HEAD:main
    - echo "---->>> SUCCESSFULLY PUSHED TO DEV (GCP) <<<----"
    - cd $CI_PROJECT_DIR

    # Temporarily modify .dockerignore to include build artifacts
    - mv .dockerignore .dockerignore.tmp
    - echo ".git/" > .dockerignore
    - echo ".npm/" >> .dockerignore
    - echo ".husky/" >> .dockerignore
    - echo "coverage/" >> .dockerignore
    - echo "docs/" >> .dockerignore
    - echo "roadmap/" >> .dockerignore
    - echo "*.md" >> .dockerignore
    - echo ".vscode/" >> .dockerignore
    - echo ".idea/" >> .dockerignore

    # Build and push with Kaniko (WARNING: destroys filesystem -- no git/yq after this point)
    - |
      /kaniko/executor \
        --cache=true \
        --cache-ttl=168h \
        --snapshot-mode=redo \
        --build-arg BASE_REGISTRY=me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo \
        --build-arg ENCRYPTION_KEY="${ENCRYPTION_KEY}" \
        --context $CI_PROJECT_DIR \
        --dockerfile Dockerfile \
        --destination ${FULL_IMAGE_NAME}

    - echo "${FULL_IMAGE_NAME}"

    # Export image for promotion jobs (only shell builtins -- no external commands available)
    - echo "FULL_IMAGE_NAME=${FULL_IMAGE_NAME}" > build_info.env
    - echo "IMAGE_FOR_UAT=${FULL_IMAGE_NAME}" >> build_info.env
  artifacts:
    reports:
      dotenv: build_info.env
    paths:
      - build_info.env
    expire_in: 1 week
  needs:
    - job: validate
      artifacts: false
      optional: true

# ====================
# Stage 4: Image Promotion (Template)
# ====================

.promote_to_base: &promote_to_base
  stage: image-promotion
  when: manual
  allow_failure: true
  before_script:
    - |
      if [ -n "$FULL_IMAGE_NAME" ]; then
        echo "Using image from environment: $FULL_IMAGE_NAME"
      elif [ -f build_info.env ]; then
        . build_info.env
        echo "Using image from artifact: $FULL_IMAGE_NAME"
      else
        echo "ERROR: No image found to promote. Make sure build job completed successfully."
        exit 1
      fi
    - echo "$FULL_IMAGE_NAME"
  script:
    - git clone --depth 1 http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - cd deployment-configs && git checkout main
    - git config pull.rebase false
    - git pull http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git

    # Update target environment values.yaml
    - export IMAGE_NAME="${FULL_IMAGE_NAME}"
    - export NPM_MIGRATION="${npm_migration}"
    - yq e -i ".deployment.imageName = strenv(FULL_IMAGE_NAME)" manifests/${PROJECT}/${VALUES_FILE}
    - yq e -i ".jobs.migrate.enabled = ${NPM_MIGRATION}" manifests/${PROJECT}/${VALUES_FILE}
    - echo "Updated configuration:"
    - cat manifests/${PROJECT}/${VALUES_FILE}

    # Commit and push
    - git config --global user.email "sdev@barq.com"
    - git config --global user.name ${GITLAB_UN}
    - git remote set-url origin "http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git"
    - git add manifests/${PROJECT}/${VALUES_FILE}
    - git commit -m "🚀 Promote ${PROJECT} image to ${TARGET_ENV}"
    - git push origin -o ci.skip HEAD:main

    - echo "---->>> SUCCESSFULLY PROMOTED TO ${TARGET_ENV} <<<----"
    - echo "Image ${IMAGE_NAME} has been promoted"

# ====================
# Stage 4: Image Promotion to UAT
# ====================

promote-to-uat:
  <<: *promote_to_base
  image: $UAT_GCP_IMAGE
  tags:
    - $UAT_GCP_LAB_TAG
  environment:
    name: uat
  variables:
    VALUES_FILE: $UAT_GCP_VALUES
    TARGET_ENV: "UAT"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy"'
      when: manual
    - when: never
  dependencies:
    - build-and-push-gcp-to-argo
  needs:
    - job: build-and-push-gcp-to-argo
      artifacts: true
