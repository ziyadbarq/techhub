# ====================
# Stage 3: Build and Deploy to ArgoCD (OCI)
# ====================

build-and-push-oci-to-argo:
  timeout: 20m
  image: $DEV_OCI_IMAGE
  stage: build_and_deploy
  variables:
    DOCKER_CONFIG: "/kaniko/.docker"
  cache:
    # Reuse cache from validate stage for faster builds
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
      - .next/cache/
    policy: pull
  rules:
    # Automatic: main branch → build_and_deploy (OCI production)
    - if: '$CI_COMMIT_BRANCH == $AUTOMATIC_TRIGGER_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      when: always
    # Manual: Web UI with build_and_deploy selected
    - if: '$CLOUD == "oci" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy" && $type != "build_only"'
      when: always
    - when: never
  tags:
    - $DEV_OCI_LAB_TAG
  environment:
    name: $DEV_ENV
  before_script:
    - echo fs.inotify.max_user_watches=524288 | tee -a /etc/sysctl.conf
  script:
    # Clone deployment-configs for Dockerfile
    - git clone --depth 1 http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - cp /.npmrc .

    # Install dependencies and build
    - npm ci --prefer-offline --cache $NPM_CACHE_DIR
    - npm run db:generate
    - npm run build

    # Generate image tag
    - version=`jq -r '.version' package.json`
    - commit_id=`git rev-parse --short=6 HEAD`
    - mkdir -p package
    - cp -r /package/. package/ || echo "No shared packages to copy"

    # Build and push with Kaniko
    - export IMAGE_TAG="${version}-${commit_id}-${CI_JOB_ID}"
    - export FULL_IMAGE_NAME="${DEV_CNTNR_OCI_REG_IMG_PREFIX}/${PROJECT}:${IMAGE_TAG}"
    - |
      /kaniko/executor \
        --context $CI_PROJECT_DIR \
        --dockerfile Dockerfile \
        --destination ${FULL_IMAGE_NAME}

    - echo "${FULL_IMAGE_NAME}"

    # Update ArgoCD values.yaml (GitOps)
    - export IMAGE_NAME="${FULL_IMAGE_NAME}"
    - export NPM_MIGRATION="${npm_migration}"
    - ORIGINAL_DIR=$(pwd)
    - cd deployment-configs && git checkout main
    - git config pull.rebase false
    - git pull http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git

    # Update image name and migration flag in values.yaml
    - yq e -i ".deployment.imageName = strenv(IMAGE_NAME)" manifests/${PROJECT}/${DEV_OCI_VALUES}
    - yq e -i ".jobs.migrate.enabled = ${NPM_MIGRATION}" manifests/${PROJECT}/${DEV_OCI_VALUES}
    - cat manifests/${PROJECT}/${DEV_OCI_VALUES}

    # Commit and push to trigger ArgoCD sync
    - git config --global user.email "sdev@barq.com"
    - git config --global user.name ${GITLAB_UN}
    - git remote set-url origin "http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git"
    - git add manifests/${PROJECT}/${DEV_OCI_VALUES}
    - git commit -m "🚀 Update ${PROJECT} DEV image to ${IMAGE_TAG}"
    - git push origin -o ci.skip HEAD:main

    - echo "---->>> SUCCESSFULLY PUSHED TO DEV (OCI) <<<----"
    - cd $ORIGINAL_DIR

    # Export image for promotion jobs
    - echo "FULL_IMAGE_NAME=${FULL_IMAGE_NAME}" > build_info.env
    - echo "IMAGE_FOR_UAT=${FULL_IMAGE_NAME}" >> build_info.env
  artifacts:
    reports:
      dotenv: build_info.env
    paths:
      - build_info.env
    expire_in: 1 week
  # dependencies:
  #   - validate
  needs:
    - job: validate
      artifacts: false

# ====================
# Stage 3: Build and Deploy to ArgoCD (GCP)
# ====================

build-and-push-gcp-to-argo:
  timeout: 20m
  image: $DEV_GCP_IMAGE #google/cloud-sdk:slim
  stage: build_and_deploy
  variables:
    DOCKER_CONFIG: "/kaniko/.docker"
  rules:
    - if: '$CLOUD =="gcp" && $CI_PIPELINE_SOURCE == "web" && $type =="build_and_deploy" && $type !="build_only"'
    - if: '$CI_COMMIT_BRANCH == $AUTOMATIC_TRIGGER_BRANCH && $CI_PIPELINE_SOURCE != "web"'
      when: always
    - when: never
  tags:
    - $DEV_GCP_LAB_TAG
  environment:
    name: $DEV_ENV
  before_script:
    # Increase inotify watchers to avoid ENOSPC
    - echo fs.inotify.max_user_watches=524288 | tee -a /etc/sysctl.conf
    - echo fs.inotify.max_user_instances=512 | tee -a /etc/sysctl.conf
    - sysctl -p
  script:
    - git clone --depth 1 http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - cp deployment-configs/dockerfiles/nodejs-gcp-Dockerfile-optimize .
    - cp deployment-configs/dockerfiles/nodejs-entrypoint.sh .
    - cp /.npmrc .

     # Install dependencies and build
    - npm ci --prefer-offline --cache $NPM_CACHE_DIR
    - npm run db:generate
    - npm run build


    - version=`jq -r '.version' package.json`
    - commit_id=`git rev-parse --short=6 HEAD`
    - mkdir package
    - cp -r /package/. package/
    - export IMAGE_TAG="${version}-${commit_id}-${CI_JOB_ID}"
    - export FULL_IMAGE_NAME="${DEV_CNTNR_GCP_REG_IMG_PREFIX}/${PROJECT}:${IMAGE_TAG}"
    - |
      /kaniko/executor \
        --context $CI_PROJECT_DIR \
        --dockerfile Dockerfile \
        --destination ${FULL_IMAGE_NAME}
    
    - echo "deploy image with job-id ${CI_JOB_ID}" 
    - export IMAGE_NAME="${FULL_IMAGE_NAME}"
    - export NPM_MIGRATION="${npm_migration}"
    - ORIGINAL_DIR=$(pwd)
    - echo "$ORIGINAL_DIR"
    - git clone --depth 1 http://${GITLAB_UN_VAL}:${GITLAB_TOKEN_VAL}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/values-yaml-npd.git
    - cd values-yaml-npd
    - yq e -i ".deployment.imageName = strenv(IMAGE_NAME)" ${PROJECT}/${DEV_GCP_VALUES}
    - cat ${PROJECT}/${DEV_GCP_VALUES}
    - git config --global user.email "sdev@barq.com"
    - git config --global user.name ${GITLAB_UN}
    - git remote set-url origin "http://${GITLAB_UN_VAL}:${GITLAB_TOKEN_VAL}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/values-yaml-npd.git" && git remote -v
    - git add ${PROJECT}/${DEV_GCP_VALUES}    
    - git commit -m "Update image tag for ${PROJECT}"
    - git push origin -o ci.skip HEAD:main
    - echo "---->>>SUCCESSFULLY PUSHED TO DEV<<<<<-------"
    - cd $ORIGINAL_DIR
    - echo "FULL_IMAGE_NAME=${FULL_IMAGE_NAME}" > build_info.env
    - echo "IMAGE_FOR_UAT=${FULL_IMAGE_NAME}" >> build_info.env
    - echo "Image exported:${FULL_IMAGE_NAME}"
  artifacts:
    reports:
      dotenv: build_info.env
    paths:
      - build_info.env
    expire_in: 1 week  

# ====================
# Stage 4: Image Promotion (Template)
# ====================

.promote_to_base: &promote_to_base
  stage: image-promotion
  when: manual
  allow_failure: true
  before_script:
    - |
      if [ -n "$FULL_IMAGE_NAME" ]; then
        echo "Using image from environment: $FULL_IMAGE_NAME"
      elif [ -f build_info.env ]; then
        . build_info.env
        echo "Using image from artifact: $FULL_IMAGE_NAME"
      else
        echo "ERROR: No image found to promote. Make sure build job completed successfully."
        exit 1
      fi
    - echo "$FULL_IMAGE_NAME"
  script:
    - git clone --depth 1 http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - cd deployment-configs && git checkout main
    - git config pull.rebase false
    - git pull http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git

    # Update target environment values.yaml
    - export IMAGE_NAME="${FULL_IMAGE_NAME}"
    - export NPM_MIGRATION="${npm_migration}"
    - yq e -i ".deployment.imageName = strenv(FULL_IMAGE_NAME)" manifests/${PROJECT}/${VALUES_FILE}
    - yq e -i ".jobs.migrate.enabled = ${NPM_MIGRATION}" manifests/${PROJECT}/${VALUES_FILE}
    - echo "Updated configuration:"
    - cat manifests/${PROJECT}/${VALUES_FILE}

    # Commit and push
    - git config --global user.email "sdev@barq.com"
    - git config --global user.name ${GITLAB_UN}
    - git remote set-url origin "http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git"
    - git add manifests/${PROJECT}/${VALUES_FILE}
    - git commit -m "🚀 Promote ${PROJECT} image to ${TARGET_ENV}"
    - git push origin -o ci.skip HEAD:main

    - echo "---->>> SUCCESSFULLY PROMOTED TO ${TARGET_ENV} <<<----"
    - echo "Image ${IMAGE_NAME} has been promoted"

# OCI Promotions
promote-to-uat-oci:
  <<: *promote_to_base
  image: $UAT_OCI_IMAGE
  tags:
    - $UAT_OCI_LAB_TAG
  environment:
    name: uat
  variables:
    VALUES_FILE: $UAT_OCI_VALUES
    TARGET_ENV: "UAT (OCI)"
  rules:
    - if: '$CLOUD == "oci" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy"'
      when: manual
    - when: never
  dependencies:
    - build-and-push-oci-to-argo
  needs:
    - job: build-and-push-oci-to-argo
      artifacts: true

promote-to-test-oci:
  <<: *promote_to_base
  image: $TEST_OCI_IMAGE
  tags:
    - $TEST_OCI_LAB_TAG
  environment:
    name: test
  variables:
    VALUES_FILE: $TEST_OCI_VALUES
    TARGET_ENV: "TEST (OCI)"
  rules:
    - if: '$CLOUD == "oci" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy"'
      when: manual
    - when: never
  dependencies:
    - build-and-push-oci-to-argo
  needs:
    - job: build-and-push-oci-to-argo
      artifacts: true

promote-to-perf-oci:
  <<: *promote_to_base
  image: $PERF_OCI_IMAGE
  tags:
    - $PERF_OCI_LAB_TAG
  environment:
    name: perf
  variables:
    VALUES_FILE: $PERF_OCI_VALUES
    TARGET_ENV: "PERF (OCI)"
  rules:
    - if: '$CLOUD == "oci" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy"'
      when: manual
    - when: never
  dependencies:
    - build-and-push-oci-to-argo
  needs:
    - job: build-and-push-oci-to-argo
      artifacts: true

# GCP Promotions
promote-to-uat-gcp:
  <<: *promote_to_base
  image: $UAT_GCP_IMAGE
  tags:
    - $UAT_GCP_LAB_TAG
  environment:
    name: uat
  variables:
    VALUES_FILE: $UAT_GCP_VALUES
    TARGET_ENV: "UAT (GCP)"
  rules:
    - if: '$CLOUD == "gcp" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy"'
      when: manual
    - when: never
  dependencies:
    - build-and-push-gcp-to-argo
  needs:
    - job: build-and-push-gcp-to-argo
      artifacts: true
