  ENCRYPTION_KEY: "0ba0bf6dea177b8442c5fed421d0fbda50eb415e73deefd975e9a5775e8564cc"

  # Logging (OPTIONAL - defaults based on NODE_ENV)
  LOG_LEVEL: "info"

