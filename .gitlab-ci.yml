# GitLab CI/CD Pipeline for TechHub
# Next.js 16 + Prisma 7 + PostgreSQL + Redis
# Kubernetes deployment via GitOps (ArgoCD) on OCI + GCP clouds

variables:
  type:
    description: "Select your desired operation"
    value: "build_only"
    options:
      - "build_only"
      - "build_and_deploy"

  CLOUD:
    description: "Select on which cloud you need to deploy"
    value: "oci"
    options:
      - "oci"
      - "gcp"

  npm_migration:
    description: "Select the flag true to run Prisma migrations"
    value: "false"
    options:
      - "true"
      - "false"

  # Project configuration
  PROJECT: "techhub"
  AUTOMATIC_TRIGGER_BRANCH: main
  DEV_BRANCH: develop
  DEV_ENV: dev
  UAT_ENV: uat
  TEST_ENV: test
  PERF_ENV: perf

  # Cache configuration
  NPM_CACHE_DIR: "$CI_PROJECT_DIR/.npm"

  # DEV OCI VARIABLES
  DEV_CNTNR_OCI_REG_IMG_PREFIX: "jed.ocir.io/axbp9ow0rohq"
  DEV_OCI_LAB_TAG: ocinode18
  DEV_OCI_VALUES: values-dev.yaml
  DEV_OCI_IMAGE: jed.ocir.io/axbp9ow0rohq/gitlab-runner-node-18-alpine

  # TEST OCI VARIABLES
  TEST_CNTNR_OCI_REG_IMG_PREFIX: "jed.ocir.io/axbp9ow0rohq"
  TEST_OCI_LAB_TAG: ocinode18
  TEST_OCI_VALUES: values-test.yaml
  TEST_OCI_IMAGE: jed.ocir.io/axbp9ow0rohq/gitlab-runner-node-18-alpine

  # UAT OCI VARIABLES
  UAT_CNTNR_OCI_REG_IMG_PREFIX: "jed.ocir.io/axbp9ow0rohq"
  UAT_OCI_LAB_TAG: ocinode18
  UAT_OCI_VALUES: values-uat.yaml
  UAT_OCI_IMAGE: jed.ocir.io/axbp9ow0rohq/gitlab-runner-node-18-alpine

  # PERF OCI VARIABLES (if needed)
  PERF_CNTNR_OCI_REG_IMG_PREFIX: "jed.ocir.io/axbp9ow0rohq"
  PERF_OCI_LAB_TAG: ocinode18
  PERF_OCI_VALUES: values-perf.yaml
  PERF_OCI_IMAGE: jed.ocir.io/axbp9ow0rohq/gitlab-runner-node-18-alpine

  # DEV GCP VARIABLES
  DEV_CNTNR_GCP_REG_IMG_PREFIX: "me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo"
  DEV_GCP_LAB_TAG: globalnodegcp
  DEV_GCP_VALUES: values-gcpdev.yaml
  DEV_GCP_IMAGE: me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo/gitlab-runner-node-18-alpine:latest

  # UAT GCP VARIABLES
  UAT_CNTNR_GCP_REG_IMG_PREFIX: "me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo"
  UAT_GCP_LAB_TAG: globalnodegcp
  UAT_GCP_VALUES: values-gcpuat.yaml
  UAT_GCP_IMAGE: me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo/gitlab-runner-node-18-alpine:latest

stages:
  - validate
  - build_only
  - build_and_deploy
  - image-promotion

# ====================
# Stage 1: Validation (Type-check, Lint, Unit Tests)
# ====================

validate:
  image: $DEV_OCI_IMAGE
  stage: validate
  tags:
    - $DEV_OCI_LAB_TAG
  cache:
    key: "validate-${CI_COMMIT_REF_SLUG}"
    paths:
      - node_modules/
      - .npm/
    policy: pull-push
  before_script:
    - cp /.npmrc .
    - npm ci --prefer-offline --cache $NPM_CACHE_DIR
    - npm run db:generate
  script:
    # Run type-check, lint, and tests
    - npm run type-check
    - npm run lint
    - npm run test -- --run --reporter=verbose
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == $AUTOMATIC_TRIGGER_BRANCH'
      when: always
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH'
      when: always
    - when: never
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 30 days

# ====================
# Stage 2: Build Only (OCI)
# ====================

build-oci:
  timeout: 20m
  image: $DEV_OCI_IMAGE
  stage: build_only
  variables:
    DOCKER_CONFIG: "/kaniko/.docker"
  rules:
    - if: '$CLOUD == "oci" && $CI_PIPELINE_SOURCE == "web" && $type == "build_only"'
    - when: never
  tags:
    - $DEV_OCI_LAB_TAG
  environment:
    name: $DEV_ENV
  before_script:
    - echo fs.inotify.max_user_watches=524288 | tee -a /etc/sysctl.conf
  script:
    # Clone deployment-configs for Dockerfile
    - git clone --depth 1 http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - cp /.npmrc .

    # Install dependencies and build
    - npm ci --prefer-offline --cache $NPM_CACHE_DIR
    - npm run db:generate
    - npm run build

    # Generate image tag
    - version=`jq -r '.version' package.json`
    - commit_id=`git rev-parse --short=6 HEAD`
    - mkdir -p package
    - cp -r /package/. package/ || echo "No shared packages to copy"

    # Build with Kaniko
    - export IMAGE_TAG="${version}-${commit_id}-${CI_JOB_ID}"
    - export FULL_IMAGE_NAME="${DEV_CNTNR_OCI_REG_IMG_PREFIX}/${PROJECT}:${IMAGE_TAG}"
    - |
      /kaniko/executor \
        --context $CI_PROJECT_DIR \
        --dockerfile Dockerfile \
        --destination ${FULL_IMAGE_NAME}

    - echo "${FULL_IMAGE_NAME}"
  dependencies:
    - validate

# ====================
# Stage 2: Build Only (GCP)
# ====================

build-gcp:
  timeout: 20m
  image: $DEV_GCP_IMAGE
  stage: build_only
  variables:
    DOCKER_CONFIG: "/kaniko/.docker"
  rules:
    - if: '$CLOUD == "gcp" && $CI_PIPELINE_SOURCE == "web" && $type == "build_only"'
    - when: never
  tags:
    - $DEV_GCP_LAB_TAG
  environment:
    name: $DEV_ENV
  before_script:
    - echo fs.inotify.max_user_watches=524288 | tee -a /etc/sysctl.conf
    - echo fs.inotify.max_user_instances=512 | tee -a /etc/sysctl.conf
    - sysctl -p
  script:
    # Clone deployment-configs for Dockerfile
    - git clone --depth 1 http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - cp /.npmrc .

    # Install dependencies and build
    - npm ci --prefer-offline --cache $NPM_CACHE_DIR
    - npm run db:generate
    - npm run build

    # Generate image tag
    - version=`jq -r '.version' package.json`
    - commit_id=`git rev-parse --short=6 HEAD`
    - mkdir -p package
    - cp -r /package/. package/ || echo "No shared packages to copy"

    # Build with Kaniko
    - export IMAGE_TAG="${version}-${commit_id}-${CI_JOB_ID}"
    - export FULL_IMAGE_NAME="${DEV_CNTNR_GCP_REG_IMG_PREFIX}/${PROJECT}:${IMAGE_TAG}"
    - |
      /kaniko/executor \
        --context $CI_PROJECT_DIR \
        --dockerfile Dockerfile \
        --destination ${FULL_IMAGE_NAME}

    - echo "${FULL_IMAGE_NAME}"
  dependencies:
    - validate

# ====================
# Stage 3: Build and Deploy to ArgoCD (OCI)
# ====================

build-and-push-oci-to-argo:
  timeout: 20m
  image: $DEV_OCI_IMAGE
  stage: build_and_deploy
  variables:
    DOCKER_CONFIG: "/kaniko/.docker"
  rules:
    - if: '$CLOUD == "oci" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy" && $type != "build_only"'
    - if: '$CLOUD == "oci" && $CI_COMMIT_BRANCH == $AUTOMATIC_TRIGGER_BRANCH && $CI_PIPELINE_SOURCE != "web"'
      when: always
    - when: never
  tags:
    - $DEV_OCI_LAB_TAG
  environment:
    name: $DEV_ENV
  before_script:
    - echo fs.inotify.max_user_watches=524288 | tee -a /etc/sysctl.conf
  script:
    # Clone deployment-configs for Dockerfile
    - git clone --depth 1 http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - cp /.npmrc .

    # Install dependencies and build
    - npm ci --prefer-offline --cache $NPM_CACHE_DIR
    - npm run db:generate
    - npm run build

    # Generate image tag
    - version=`jq -r '.version' package.json`
    - commit_id=`git rev-parse --short=6 HEAD`
    - mkdir -p package
    - cp -r /package/. package/ || echo "No shared packages to copy"

    # Build and push with Kaniko
    - export IMAGE_TAG="${version}-${commit_id}-${CI_JOB_ID}"
    - export FULL_IMAGE_NAME="${DEV_CNTNR_OCI_REG_IMG_PREFIX}/${PROJECT}:${IMAGE_TAG}"
    - |
      /kaniko/executor \
        --context $CI_PROJECT_DIR \
        --dockerfile Dockerfile \
        --destination ${FULL_IMAGE_NAME}

    - echo "${FULL_IMAGE_NAME}"

    # Update ArgoCD values.yaml (GitOps)
    - export IMAGE_NAME="${FULL_IMAGE_NAME}"
    - export NPM_MIGRATION="${npm_migration}"
    - ORIGINAL_DIR=$(pwd)
    - cd deployment-configs && git checkout main
    - git config pull.rebase false
    - git pull http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git

    # Update image name and migration flag in values.yaml
    - yq e -i ".deployment.imageName = strenv(IMAGE_NAME)" manifests/${PROJECT}/${DEV_OCI_VALUES}
    - yq e -i ".jobs.migrate.enabled = ${NPM_MIGRATION}" manifests/${PROJECT}/${DEV_OCI_VALUES}
    - cat manifests/${PROJECT}/${DEV_OCI_VALUES}

    # Commit and push to trigger ArgoCD sync
    - git config --global user.email "sdev@barq.com"
    - git config --global user.name ${GITLAB_UN}
    - git remote set-url origin "http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git"
    - git add manifests/${PROJECT}/${DEV_OCI_VALUES}
    - git commit -m "🚀 Update ${PROJECT} DEV image to ${IMAGE_TAG}"
    - git push origin -o ci.skip HEAD:main

    - echo "---->>> SUCCESSFULLY PUSHED TO DEV (OCI) <<<----"
    - cd $ORIGINAL_DIR

    # Export image for promotion jobs
    - echo "FULL_IMAGE_NAME=${FULL_IMAGE_NAME}" > build_info.env
    - echo "IMAGE_FOR_UAT=${FULL_IMAGE_NAME}" >> build_info.env
  artifacts:
    reports:
      dotenv: build_info.env
    paths:
      - build_info.env
    expire_in: 1 week
  dependencies:
    - validate

# ====================
# Stage 3: Build and Deploy to ArgoCD (GCP)
# ====================

build-and-push-gcp-to-argo:
  timeout: 20m
  image: $DEV_GCP_IMAGE
  stage: build_and_deploy
  variables:
    DOCKER_CONFIG: "/kaniko/.docker"
  rules:
    - if: '$CLOUD == "gcp" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy" && $type != "build_only"'
    - if: '$CLOUD == "gcp" && $CI_COMMIT_BRANCH == $DEV_BRANCH && $CI_PIPELINE_SOURCE != "web"'
      when: always
    - when: never
  tags:
    - $DEV_GCP_LAB_TAG
  environment:
    name: $DEV_ENV
  before_script:
    - echo fs.inotify.max_user_watches=524288 | tee -a /etc/sysctl.conf
    - echo fs.inotify.max_user_instances=512 | tee -a /etc/sysctl.conf
    - sysctl -p
  script:
    # Clone deployment-configs for Dockerfile
    - git clone --depth 1 http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - cp /.npmrc .

    # Install dependencies and build
    - npm ci --prefer-offline --cache $NPM_CACHE_DIR
    - npm run db:generate
    - npm run build

    # Generate image tag
    - version=`jq -r '.version' package.json`
    - commit_id=`git rev-parse --short=6 HEAD`
    - mkdir -p package
    - cp -r /package/. package/ || echo "No shared packages to copy"

    # Build and push with Kaniko
    - export IMAGE_TAG="${version}-${commit_id}-${CI_JOB_ID}"
    - export FULL_IMAGE_NAME="${DEV_CNTNR_GCP_REG_IMG_PREFIX}/${PROJECT}:${IMAGE_TAG}"
    - |
      /kaniko/executor \
        --context $CI_PROJECT_DIR \
        --dockerfile Dockerfile \
        --destination ${FULL_IMAGE_NAME}

    - echo "${FULL_IMAGE_NAME}"

    # Update ArgoCD values.yaml (GitOps)
    - export IMAGE_NAME="${FULL_IMAGE_NAME}"
    - export NPM_MIGRATION="${npm_migration}"
    - ORIGINAL_DIR=$(pwd)
    - cd deployment-configs && git checkout main
    - git config pull.rebase false
    - git pull http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git

    # Update image name and migration flag in values.yaml
    - yq e -i ".deployment.imageName = strenv(IMAGE_NAME)" manifests/${PROJECT}/${DEV_GCP_VALUES}
    - yq e -i ".jobs.migrate.enabled = ${NPM_MIGRATION}" manifests/${PROJECT}/${DEV_GCP_VALUES}
    - cat manifests/${PROJECT}/${DEV_GCP_VALUES}

    # Commit and push to trigger ArgoCD sync
    - git config --global user.email "sdev@barq.com"
    - git config --global user.name ${GITLAB_UN}
    - git remote set-url origin "http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git"
    - git add manifests/${PROJECT}/${DEV_GCP_VALUES}
    - git commit -m "🚀 Update ${PROJECT} DEV image to ${IMAGE_TAG}"
    - git push origin -o ci.skip HEAD:main

    - echo "---->>> SUCCESSFULLY PUSHED TO DEV (GCP) <<<----"
    - cd $ORIGINAL_DIR

    # Export image for promotion jobs
    - echo "FULL_IMAGE_NAME=${FULL_IMAGE_NAME}" > build_info.env
    - echo "IMAGE_FOR_UAT=${FULL_IMAGE_NAME}" >> build_info.env
  artifacts:
    reports:
      dotenv: build_info.env
    paths:
      - build_info.env
    expire_in: 1 week
  dependencies:
    - validate

# ====================
# Stage 4: Image Promotion (Template)
# ====================

.promote_to_base: &promote_to_base
  stage: image-promotion
  when: manual
  allow_failure: true
  before_script:
    - |
      if [ -n "$FULL_IMAGE_NAME" ]; then
        echo "Using image from environment: $FULL_IMAGE_NAME"
      elif [ -f build_info.env ]; then
        source build_info.env
        echo "Using image from artifact: $FULL_IMAGE_NAME"
      else
        echo "ERROR: No image found to promote. Make sure build job completed successfully."
        exit 1
      fi
    - echo "$FULL_IMAGE_NAME"
  script:
    - git clone --depth 1 http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - cd deployment-configs && git checkout main
    - git config pull.rebase false
    - git pull http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git

    # Update target environment values.yaml
    - export IMAGE_NAME="${FULL_IMAGE_NAME}"
    - export NPM_MIGRATION="${npm_migration}"
    - yq e -i ".deployment.imageName = strenv(FULL_IMAGE_NAME)" manifests/${PROJECT}/${VALUES_FILE}
    - yq e -i ".jobs.migrate.enabled = ${NPM_MIGRATION}" manifests/${PROJECT}/${VALUES_FILE}
    - echo "Updated configuration:"
    - cat manifests/${PROJECT}/${VALUES_FILE}

    # Commit and push
    - git config --global user.email "sdev@barq.com"
    - git config --global user.name ${GITLAB_UN}
    - git remote set-url origin "http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git"
    - git add manifests/${PROJECT}/${VALUES_FILE}
    - git commit -m "🚀 Promote ${PROJECT} image to ${TARGET_ENV}"
    - git push origin -o ci.skip HEAD:main

    - echo "---->>> SUCCESSFULLY PROMOTED TO ${TARGET_ENV} <<<----"
    - echo "Image ${IMAGE_NAME} has been promoted"

# OCI Promotions
promote-to-uat-oci:
  <<: *promote_to_base
  image: $UAT_OCI_IMAGE
  tags:
    - $UAT_OCI_LAB_TAG
  environment:
    name: uat
  variables:
    VALUES_FILE: $UAT_OCI_VALUES
    TARGET_ENV: "UAT (OCI)"
  rules:
    - if: '$CLOUD == "oci" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy"'
      when: manual
    - if: '$CLOUD == "oci" && $CI_COMMIT_BRANCH == $AUTOMATIC_TRIGGER_BRANCH && $CI_PIPELINE_SOURCE != "web"'
      when: manual
    - when: never
  dependencies:
    - build-and-push-oci-to-argo
  needs:
    - job: build-and-push-oci-to-argo
      artifacts: true

promote-to-test-oci:
  <<: *promote_to_base
  image: $TEST_OCI_IMAGE
  tags:
    - $TEST_OCI_LAB_TAG
  environment:
    name: test
  variables:
    VALUES_FILE: $TEST_OCI_VALUES
    TARGET_ENV: "TEST (OCI)"
  rules:
    - if: '$CLOUD == "oci" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy"'
      when: manual
    - if: '$CLOUD == "oci" && $CI_COMMIT_BRANCH == $AUTOMATIC_TRIGGER_BRANCH && $CI_PIPELINE_SOURCE != "web"'
      when: manual
    - when: never
  dependencies:
    - build-and-push-oci-to-argo
  needs:
    - job: build-and-push-oci-to-argo
      artifacts: true

promote-to-perf-oci:
  <<: *promote_to_base
  image: $PERF_OCI_IMAGE
  tags:
    - $PERF_OCI_LAB_TAG
  environment:
    name: perf
  variables:
    VALUES_FILE: $PERF_OCI_VALUES
    TARGET_ENV: "PERF (OCI)"
  rules:
    - if: '$CLOUD == "oci" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy"'
      when: manual
    - when: never
  dependencies:
    - build-and-push-oci-to-argo
  needs:
    - job: build-and-push-oci-to-argo
      artifacts: true

# GCP Promotions
promote-to-uat-gcp:
  <<: *promote_to_base
  image: $UAT_GCP_IMAGE
  tags:
    - $UAT_GCP_LAB_TAG
  environment:
    name: uat
  variables:
    VALUES_FILE: $UAT_GCP_VALUES
    TARGET_ENV: "UAT (GCP)"
  rules:
    - if: '$CLOUD == "gcp" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy"'
      when: manual
    - if: '$CLOUD == "gcp" && $CI_COMMIT_BRANCH == $DEV_BRANCH && $CI_PIPELINE_SOURCE != "web"'
      when: manual
    - when: never
  dependencies:
    - build-and-push-gcp-to-argo
  needs:
    - job: build-and-push-gcp-to-argo
      artifacts: true