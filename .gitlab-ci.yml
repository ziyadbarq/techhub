# GitLab CI/CD Pipeline for TechHub
# Next.js 16 + Prisma 7 + PostgreSQL + Redis
# Kubernetes deployment via GitOps (ArgoCD) on OCI and GCP
#
# ====================
# AUTOMATED WORKFLOW
# ====================
#
# Manual triggers (GitLab UI):
#   - build_only for OCI or GCP
#   - build_and_deploy for OCI or GCP
#   - OCI deploys remain manual
#
# Secrets:
#   - Keep DATABASE_URL, ENCRYPTION_KEY, and auth/config values in GitLab CI/CD
#     variables or the runtime config source. Do not hardcode them here.

variables:
  type:
    description: "Select your desired operation"
    value: "build_only"
    options:
      - "build_only"
      - "build_and_deploy"

  CLOUD:
    description: "Select on which cloud you need to deploy"
    value: "gcp"
    options:
      - "gcp"
      - "oci"

  npm_migration:
    description: "Select the flag true to run Prisma migrations"
    value: "false"
    options:
      - "true"
      - "false"

  PROJECT: "techhub"
  DEV_ENV: dev
  UAT_ENV: uat
  TEST_ENV: test
  PERF_ENV: perf

  NPM_CACHE_DIR: "$CI_PROJECT_DIR/.npm"
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
  NPM_CONFIG_NETWORK_TIMEOUT: "600000"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_PROGRESS: "false"
  NPM_CONFIG_LOGLEVEL: "warn"
  NPM_CI_FLAGS: "--prefer-offline --cache $NPM_CACHE_DIR --legacy-peer-deps"

  # CI variables such as DATABASE_URL, ENCRYPTION_KEY, BETTER_AUTH_URL,
  # CONFIG_SERVER_URL, and Git credentials must be set in GitLab CI/CD settings.

  # OCI
  DEV_CNTNR_OCI_REG_IMG_PREFIX: "jed.ocir.io/axbp9ow0rohq"
  DEV_OCI_LAB_TAG: globalnodeoci
  DEV_OCI_VALUES: values-dev.yaml
  DEV_OCI_IMAGE: jed.ocir.io/axbp9ow0rohq/gitlab-runner-node-22-alpine

  TEST_CNTNR_OCI_REG_IMG_PREFIX: "jed.ocir.io/axbp9ow0rohq"
  TEST_OCI_LAB_TAG: globalnodeoci
  TEST_OCI_VALUES: values-test.yaml
  TEST_OCI_IMAGE: jed.ocir.io/axbp9ow0rohq/gitlab-runner-node-22-alpine

  UAT_CNTNR_OCI_REG_IMG_PREFIX: "jed.ocir.io/axbp9ow0rohq"
  UAT_OCI_LAB_TAG: globalnodeoci
  UAT_OCI_VALUES: values-uat.yaml
  UAT_OCI_IMAGE: jed.ocir.io/axbp9ow0rohq/gitlab-runner-node-22-alpine

  PERF_CNTNR_OCI_REG_IMG_PREFIX: "jed.ocir.io/axbp9ow0rohq"
  PERF_OCI_LAB_TAG: globalnodeoci
  PERF_OCI_VALUES: values-perf.yaml
  PERF_OCI_IMAGE: jed.ocir.io/axbp9ow0rohq/gitlab-runner-node-22-alpine

  # GCP
  DEV_CNTNR_GCP_REG_IMG_PREFIX: "me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo"
  DEV_GCP_LAB_TAG: globalnodegcp
  DEV_GCP_VALUES: values-gcpdev.yaml
  DEV_GCP_IMAGE: me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo/gitlab-runner-node-22-alpine:latest

  UAT_CNTNR_GCP_REG_IMG_PREFIX: "me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo"
  UAT_GCP_LAB_TAG: globalnodegcp
  UAT_GCP_VALUES: values-gcpuat.yaml
  UAT_GCP_IMAGE: me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo/gitlab-runner-node-22-alpine:latest

stages:
  - build_only
  - build_and_deploy
  - image-promotion

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never

.build_cache: &build_cache
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .npm/
    - .next/cache/
  policy: pull

.build_metrics_after_script: &build_metrics_after_script
  - echo "Job Duration:${CI_JOB_DURATION}s" | tee -a ${BUILD_METRICS_FILE}
  - echo "Pipeline:${CI_PIPELINE_ID}" | tee -a ${BUILD_METRICS_FILE}
  - echo "Commit:${CI_COMMIT_SHORT_SHA}" | tee -a ${BUILD_METRICS_FILE}
  - if [ -d .next ]; then echo "Next.js build size:$(du -sh .next | cut -f1)" | tee -a ${BUILD_METRICS_FILE}; echo "Static files:$(du -sh .next/static 2>/dev/null | cut -f1 || echo N/A)" | tee -a ${BUILD_METRICS_FILE}; fi
  - if [ -d node_modules ]; then echo "node_modules size:$(du -sh node_modules | cut -f1)" | tee -a ${BUILD_METRICS_FILE}; fi

build-gcp:
  timeout: 30m
  image: $DEV_GCP_IMAGE
  stage: build_only
  variables:
    DOCKER_CONFIG: "/kaniko/.docker"
    BUILD_METRICS_FILE: "build-size-gcp.txt"
  cache:
    <<: *build_cache
  rules:
    - if: '$CLOUD == "gcp" && $CI_PIPELINE_SOURCE == "web" && $type == "build_only"'
      when: always
    - when: never
  tags:
    - $DEV_GCP_LAB_TAG
  environment:
    name: $DEV_ENV
  before_script:
    - echo fs.inotify.max_user_watches=524288 | tee -a /etc/sysctl.conf
    - echo fs.inotify.max_user_instances=512 | tee -a /etc/sysctl.conf
    - sysctl -p
  script:
    - git clone --depth 1 http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - cp /.npmrc .
    - npm ci $NPM_CI_FLAGS
    - npm run db:generate
    - npm run build:fast
    - version=`jq -r '.version' package.json`
    - commit_id=`git rev-parse --short=6 HEAD`
    - mkdir -p package
    - cp -r /package/. package/ || echo "No shared packages to copy"
    - mv .dockerignore .dockerignore.tmp
    - echo ".git/" > .dockerignore
    - echo ".npm/" >> .dockerignore
    - echo ".husky/" >> .dockerignore
    - echo "coverage/" >> .dockerignore
    - echo "docs/" >> .dockerignore
    - echo "roadmap/" >> .dockerignore
    - echo "*.md" >> .dockerignore
    - echo ".vscode/" >> .dockerignore
    - echo ".idea/" >> .dockerignore
    - export IMAGE_TAG="${version}-${commit_id}-${CI_JOB_ID}"
    - export FULL_IMAGE_NAME="${DEV_CNTNR_GCP_REG_IMG_PREFIX}/${PROJECT}:${IMAGE_TAG}"
    - |
      /kaniko/executor \
        --cache=true \
        --cache-ttl=168h \
        --snapshot-mode=redo \
        --build-arg BASE_REGISTRY=me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo \
        --context $CI_PROJECT_DIR \
        --dockerfile Dockerfile \
        --destination ${FULL_IMAGE_NAME}
    - mv .dockerignore.tmp .dockerignore
    - echo "📊 Build Metrics (GCP)" | tee ${BUILD_METRICS_FILE}
    - echo "${FULL_IMAGE_NAME}"
  after_script: *build_metrics_after_script
  artifacts:
    paths:
      - build-size-gcp.txt
    expire_in: 7 days

build-oci:
  timeout: 30m
  image: $DEV_OCI_IMAGE
  stage: build_only
  variables:
    DOCKER_CONFIG: "/kaniko/.docker"
    BUILD_METRICS_FILE: "build-size-oci.txt"
  cache:
    <<: *build_cache
  rules:
    - if: '$CLOUD == "oci" && $CI_PIPELINE_SOURCE == "web" && $type == "build_only"'
      when: always
    - when: never
  tags:
    - $DEV_OCI_LAB_TAG
  environment:
    name: $DEV_ENV
  before_script:
    - echo fs.inotify.max_user_watches=524288 | tee -a /etc/sysctl.conf
  script:
    - git clone --depth 1 http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - cp /.npmrc .
    - npm ci $NPM_CI_FLAGS
    - npm run db:generate
    - npm run build:fast
    - version=`jq -r '.version' package.json`
    - commit_id=`git rev-parse --short=6 HEAD`
    - mkdir -p package
    - cp -r /package/. package/ || echo "No shared packages to copy"
    - mv .dockerignore .dockerignore.tmp
    - echo ".git/" > .dockerignore
    - echo ".npm/" >> .dockerignore
    - echo ".husky/" >> .dockerignore
    - echo "coverage/" >> .dockerignore
    - echo "docs/" >> .dockerignore
    - echo "roadmap/" >> .dockerignore
    - echo "*.md" >> .dockerignore
    - echo ".vscode/" >> .dockerignore
    - echo ".idea/" >> .dockerignore
    - export IMAGE_TAG="${version}-${commit_id}-${CI_JOB_ID}"
    - export FULL_IMAGE_NAME="${DEV_CNTNR_OCI_REG_IMG_PREFIX}/${PROJECT}:${IMAGE_TAG}"
    - |
      /kaniko/executor \
        --cache=true \
        --cache-ttl=168h \
        --snapshot-mode=redo \
        --build-arg BASE_REGISTRY=jed.ocir.io/axbp9ow0rohq \
        --context $CI_PROJECT_DIR \
        --dockerfile Dockerfile \
        --destination ${FULL_IMAGE_NAME}
    - mv .dockerignore.tmp .dockerignore
    - echo "📊 Build Metrics (OCI)" | tee ${BUILD_METRICS_FILE}
    - echo "${FULL_IMAGE_NAME}"
  after_script: *build_metrics_after_script
  artifacts:
    paths:
      - build-size-oci.txt
    expire_in: 7 days

build-and-push-gcp-to-argo:
  timeout: 30m
  image: $DEV_GCP_IMAGE
  stage: build_and_deploy
  variables:
    DOCKER_CONFIG: "/kaniko/.docker"
  cache:
    <<: *build_cache
  rules:
    - if: '$CLOUD == "gcp" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy"'
      when: always
    - when: never
  tags:
    - $DEV_GCP_LAB_TAG
  environment:
    name: $DEV_ENV
  before_script:
    - echo fs.inotify.max_user_watches=524288 | tee -a /etc/sysctl.conf
    - echo fs.inotify.max_user_instances=512 | tee -a /etc/sysctl.conf
    - sysctl -p
  script:
    - git clone --depth 1 http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - cp /.npmrc .
    - npm ci $NPM_CI_FLAGS
    - npm run db:generate
    - npm run build:fast
    - version=`jq -r '.version' package.json`
    - commit_id=`git rev-parse --short=6 HEAD`
    - mkdir -p package
    - cp -r /package/. package/ || echo "No shared packages to copy"
    - export IMAGE_TAG="${version}-${commit_id}-${CI_JOB_ID}"
    - export FULL_IMAGE_NAME="${DEV_CNTNR_GCP_REG_IMG_PREFIX}/${PROJECT}:${IMAGE_TAG}"
    - export IMAGE_NAME="${FULL_IMAGE_NAME}"
    - export NPM_MIGRATION="${npm_migration}"
    - git clone --depth 1 http://${GITLAB_UN_VAL}:${GITLAB_TOKEN_VAL}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/values-yaml-npd.git
    - cd values-yaml-npd
    - yq e -i ".deployment.imageName = strenv(IMAGE_NAME)" ${PROJECT}/${DEV_GCP_VALUES}
    - yq e -i ".jobs.migrate.enabled = ${NPM_MIGRATION}" ${PROJECT}/${DEV_GCP_VALUES}
    - cat ${PROJECT}/${DEV_GCP_VALUES}
    - git config --global user.email "sdev@barq.com"
    - git config --global user.name ${GITLAB_UN}
    - git remote set-url origin "http://${GITLAB_UN_VAL}:${GITLAB_TOKEN_VAL}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/values-yaml-npd.git"
    - git add ${PROJECT}/${DEV_GCP_VALUES}
    - git commit -m "🚀 Update ${PROJECT} DEV image to ${IMAGE_TAG}"
    - git push origin -o ci.skip HEAD:main
    - cd $CI_PROJECT_DIR
    - mv .dockerignore .dockerignore.tmp
    - echo ".git/" > .dockerignore
    - echo ".npm/" >> .dockerignore
    - echo ".husky/" >> .dockerignore
    - echo "coverage/" >> .dockerignore
    - echo "docs/" >> .dockerignore
    - echo "roadmap/" >> .dockerignore
    - echo "*.md" >> .dockerignore
    - echo ".vscode/" >> .dockerignore
    - echo ".idea/" >> .dockerignore
    - |
      /kaniko/executor \
        --cache=true \
        --cache-ttl=168h \
        --snapshot-mode=redo \
        --build-arg BASE_REGISTRY=me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo \
        --context $CI_PROJECT_DIR \
        --dockerfile Dockerfile \
        --destination ${FULL_IMAGE_NAME}
    - mv .dockerignore.tmp .dockerignore
    - echo "${FULL_IMAGE_NAME}"
    - echo "FULL_IMAGE_NAME=${FULL_IMAGE_NAME}" > build_info.env
    - echo "IMAGE_FOR_UAT=${FULL_IMAGE_NAME}" >> build_info.env
  artifacts:
    reports:
      dotenv: build_info.env
    paths:
      - build_info.env
    expire_in: 1 week

build-and-push-oci-to-argo:
  timeout: 30m
  image: $DEV_OCI_IMAGE
  stage: build_and_deploy
  variables:
    DOCKER_CONFIG: "/kaniko/.docker"
  cache:
    <<: *build_cache
  rules:
    - if: '$CLOUD == "oci" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy"'
      when: always
    - when: never
  tags:
    - $DEV_OCI_LAB_TAG
  environment:
    name: $DEV_ENV
  before_script:
    - echo fs.inotify.max_user_watches=524288 | tee -a /etc/sysctl.conf
  script:
    - git clone --depth 1 http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - cp /.npmrc .
    - npm ci $NPM_CI_FLAGS
    - npm run db:generate
    - npm run build:fast
    - version=`jq -r '.version' package.json`
    - commit_id=`git rev-parse --short=6 HEAD`
    - mkdir -p package
    - cp -r /package/. package/ || echo "No shared packages to copy"
    - export IMAGE_TAG="${version}-${commit_id}-${CI_JOB_ID}"
    - export FULL_IMAGE_NAME="${DEV_CNTNR_OCI_REG_IMG_PREFIX}/${PROJECT}:${IMAGE_TAG}"
    - export IMAGE_NAME="${FULL_IMAGE_NAME}"
    - export NPM_MIGRATION="${npm_migration}"
    - ORIGINAL_DIR=$(pwd)
    - cd deployment-configs && git checkout main
    - git config pull.rebase false
    - git pull http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - yq e -i ".deployment.imageName = strenv(IMAGE_NAME)" manifests/${PROJECT}/${DEV_OCI_VALUES}
    - yq e -i ".jobs.migrate.enabled = ${NPM_MIGRATION}" manifests/${PROJECT}/${DEV_OCI_VALUES}
    - cat manifests/${PROJECT}/${DEV_OCI_VALUES}
    - git config --global user.email "sdev@barq.com"
    - git config --global user.name ${GITLAB_UN}
    - git remote set-url origin "http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git"
    - git add manifests/${PROJECT}/${DEV_OCI_VALUES}
    - git commit -m "🚀 Update ${PROJECT} DEV image to ${IMAGE_TAG}"
    - git push origin -o ci.skip HEAD:main
    - cd $ORIGINAL_DIR
    - mv .dockerignore .dockerignore.tmp
    - echo ".git/" > .dockerignore
    - echo ".npm/" >> .dockerignore
    - echo ".husky/" >> .dockerignore
    - echo "coverage/" >> .dockerignore
    - echo "docs/" >> .dockerignore
    - echo "roadmap/" >> .dockerignore
    - echo "*.md" >> .dockerignore
    - echo ".vscode/" >> .dockerignore
    - echo ".idea/" >> .dockerignore
    - |
      /kaniko/executor \
        --cache=true \
        --cache-ttl=168h \
        --snapshot-mode=redo \
        --build-arg BASE_REGISTRY=jed.ocir.io/axbp9ow0rohq \
        --context $CI_PROJECT_DIR \
        --dockerfile Dockerfile \
        --destination ${FULL_IMAGE_NAME}
    - mv .dockerignore.tmp .dockerignore
    - echo "${FULL_IMAGE_NAME}"
    - echo "FULL_IMAGE_NAME=${FULL_IMAGE_NAME}" > build_info.env
    - echo "IMAGE_FOR_UAT=${FULL_IMAGE_NAME}" >> build_info.env
  artifacts:
    reports:
      dotenv: build_info.env
    paths:
      - build_info.env
    expire_in: 1 week

.promote_to_base: &promote_to_base
  stage: image-promotion
  when: manual
  allow_failure: true
  before_script:
    - |
      if [ -n "$FULL_IMAGE_NAME" ]; then
        echo "Using image from environment: $FULL_IMAGE_NAME"
      elif [ -f build_info.env ]; then
        . build_info.env
        echo "Using image from artifact: $FULL_IMAGE_NAME"
      else
        echo "ERROR: No image found to promote. Make sure build job completed successfully."
        exit 1
      fi
    - echo "$FULL_IMAGE_NAME"
  script:
    - git clone --depth 1 http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - cd deployment-configs && git checkout main
    - git config pull.rebase false
    - git pull http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - export IMAGE_NAME="${FULL_IMAGE_NAME}"
    - export NPM_MIGRATION="${npm_migration}"
    - yq e -i ".deployment.imageName = strenv(FULL_IMAGE_NAME)" manifests/${PROJECT}/${VALUES_FILE}
    - yq e -i ".jobs.migrate.enabled = ${NPM_MIGRATION}" manifests/${PROJECT}/${VALUES_FILE}
    - cat manifests/${PROJECT}/${VALUES_FILE}
    - git config --global user.email "sdev@barq.com"
    - git config --global user.name ${GITLAB_UN}
    - git remote set-url origin "http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git"
    - git add manifests/${PROJECT}/${VALUES_FILE}
    - git commit -m "🚀 Promote ${PROJECT} image to ${TARGET_ENV}"
    - git push origin -o ci.skip HEAD:main

promote-to-uat-oci:
  <<: *promote_to_base
  image: $UAT_OCI_IMAGE
  tags:
    - $UAT_OCI_LAB_TAG
  environment:
    name: uat
  variables:
    VALUES_FILE: $UAT_OCI_VALUES
    TARGET_ENV: "UAT (OCI)"
  rules:
    - if: '$CLOUD == "oci" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy"'
      when: manual
    - when: never
  dependencies:
    - build-and-push-oci-to-argo

promote-to-uat-gcp:
  <<: *promote_to_base
  image: $UAT_GCP_IMAGE
  tags:
    - $UAT_GCP_LAB_TAG
  environment:
    name: uat
  variables:
    VALUES_FILE: $UAT_GCP_VALUES
    TARGET_ENV: "UAT (GCP)"
  rules:
    - if: '$CLOUD == "gcp" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy"'
      when: manual
    - when: never
  dependencies:
    - build-and-push-gcp-to-argo
