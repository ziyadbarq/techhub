# GitLab CI/CD Pipeline for TechHub
# Next.js 16 + Prisma 7 + PostgreSQL + Redis
# Kubernetes deployment via Helm (OCI + GCP clouds)
#
# Pipeline Stages:
# 1. install     - Install dependencies + Prisma client generation (~1-3 min)
# 2. validate    - Parallel type-check, lint, unit tests (~2 min)
# 3. build       - Next.js production build (~3-5 min)
# 4. test        - Integration tests with PostgreSQL + Redis (~2-4 min)
# 5. docker      - Build and push Docker image (~3-5 min)
# 6. deploy      - Helm deployment to Kubernetes (~2-3 min)
#
# Total Duration: ~18-22 minutes (with cache) | ~28-32 minutes (cold start)

# ====================
# Global Configuration
# ====================

image: node:20-alpine

# Global cache configuration
# Cache is keyed on package-lock.json to invalidate when dependencies change
cache:
  key:
    files:
      - package-lock.json
    prefix: $CI_COMMIT_REF_SLUG
  paths:
    - node_modules/
    - .next/cache/
    - .npm/

# Pipeline stages
stages:
  - install
  - validate
  - build
  - test
  - docker
  - deploy

# ====================
# Variables
# ====================

variables:
  # Docker image configuration
  DOCKER_IMAGE_NAME: techhub
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"

  # OCI Registry (for OCI cloud deployments)
  OCI_REGISTRY: $OCI_REGISTRY_URL
  OCI_IMAGE_TAG: $OCI_REGISTRY/$DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA

  # GCP Registry (for GCP cloud deployments)
  GCP_REGISTRY: $GCP_REGISTRY_URL
  GCP_IMAGE_TAG: $GCP_REGISTRY/$DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA

  # Kubernetes namespaces
  K8S_NAMESPACE_OCI_DEV: istio-dev
  K8S_NAMESPACE_GCP_DEV: horizontal-services

  # Helm chart configuration
  HELM_CHART_REPO: http://gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs
  HELM_VALUES_PATH: manifests/techhub/values-dev.yaml

# ====================
# Stage 1: Install Dependencies
# ====================

install-dependencies:
  stage: install
  before_script:
    # Install system dependencies for node-gyp compilation (sharp, bcrypt, etc.)
    - apk add --no-cache python3 make g++
  script:
    # Use npm ci for reproducible builds
    - npm ci --cache .npm --prefer-offline --include=dev
    # Generate Prisma client (required for TypeScript type-checking and builds)
    - npm run db:generate
  artifacts:
    paths:
      - node_modules/
      - src/generated/prisma/
    expire_in: 1 hour
  cache:
    key: deps-$CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
      - .npm/
  only:
    - main
    - develop
    - merge_requests

# ====================
# Stage 2: Validation (Parallel Jobs)
# ====================

type-check:
  stage: validate
  needs:
    - install-dependencies
  script:
    - npm run type-check
  only:
    - main
    - develop
    - merge_requests

lint:
  stage: validate
  needs:
    - install-dependencies
  script:
    - npm run lint
  only:
    - main
    - develop
    - merge_requests

unit-tests:
  stage: validate
  needs:
    - install-dependencies
  script:
    - npm run test -- --run --reporter=verbose
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 30 days
  only:
    - main
    - develop
    - merge_requests

# ====================
# Stage 3: Build
# ====================

build-nextjs:
  stage: build
  needs:
    - install-dependencies
    - type-check
    - lint
  variables:
    # Mock DATABASE_URL for build (Prisma client initialization)
    # Next.js build process initializes Prisma client even though it's not used at build time
    DATABASE_URL: "postgresql://build:build@localhost:5432/build"
    REDIS_URL: "redis://localhost:6379"
    SKIP_TYPE_CHECK: "true"
  script:
    - npm run build:fast
  artifacts:
    paths:
      - .next/
      - public/
    expire_in: 1 hour
  cache:
    key: build-$CI_COMMIT_REF_SLUG
    paths:
      - .next/cache/
  only:
    - main
    - develop
    - merge_requests

# ====================
# Stage 4: Integration Tests
# ====================

integration-tests:
  stage: test
  needs:
    - install-dependencies
  services:
    - name: postgres:16-alpine
      alias: postgres
      variables:
        POSTGRES_DB: test
        POSTGRES_USER: test
        POSTGRES_PASSWORD: test
    - name: redis:7-alpine
      alias: redis
  variables:
    DATABASE_URL: "postgresql://test:test@postgres:5432/test"
    REDIS_URL: "redis://redis:6379"
  before_script:
    # Install PostgreSQL client for connection testing
    - apk add --no-cache postgresql-client
    # Wait for PostgreSQL to be ready (retry until connection succeeds)
    - until PGPASSWORD=test psql -h postgres -U test -d test -c '\q'; do echo "Waiting for PostgreSQL..."; sleep 2; done
    # Run migrations on test database
    # Note: Using || true because some migrations may already be applied or fail in test environment
    - npx dotenv -e .env.local -- prisma migrate deploy || true
  script:
    # Run integration tests (use-cases and DI container tests)
    - npm run test -- --run --reporter=verbose tests/use-cases/ tests/di/
  only:
    - main
    - develop
    - merge_requests

# ====================
# Stage 5: Docker Build & Push
# ====================

.docker-build-template: &docker-build-template
  stage: docker
  image: docker:24-dind
  services:
    - docker:24-dind
  needs:
    - build-nextjs
    - unit-tests
    - integration-tests
  before_script:
    - docker info
  only:
    - main
    - develop

# Build and push to OCI Registry
docker-build-oci:
  <<: *docker-build-template
  script:
    # Login to OCI registry
    - echo "$OCI_REGISTRY_PASSWORD" | docker login -u "$OCI_REGISTRY_USERNAME" --password-stdin $OCI_REGISTRY

    # Build Docker image
    - |
      docker build \
        --build-arg NODE_ENV=production \
        --build-arg NEXT_PUBLIC_APP_VERSION=$CI_COMMIT_SHORT_SHA \
        -t $OCI_IMAGE_TAG \
        -t $OCI_REGISTRY/$DOCKER_IMAGE_NAME:latest \
        -f Dockerfile .

    # Push to OCI registry
    - docker push $OCI_IMAGE_TAG
    - docker push $OCI_REGISTRY/$DOCKER_IMAGE_NAME:latest

    # Cleanup
    - docker logout $OCI_REGISTRY
  only:
    - main

# Build and push to GCP Registry
docker-build-gcp:
  <<: *docker-build-template
  script:
    # Login to GCP registry (using service account key)
    - echo "$GCP_SERVICE_ACCOUNT_KEY" | docker login -u _json_key --password-stdin $GCP_REGISTRY

    # Build Docker image
    - |
      docker build \
        --build-arg NODE_ENV=production \
        --build-arg NEXT_PUBLIC_APP_VERSION=$CI_COMMIT_SHORT_SHA \
        -t $GCP_IMAGE_TAG \
        -t $GCP_REGISTRY/$DOCKER_IMAGE_NAME:latest \
        -f Dockerfile .

    # Push to GCP registry
    - docker push $GCP_IMAGE_TAG
    - docker push $GCP_REGISTRY/$DOCKER_IMAGE_NAME:latest

    # Cleanup
    - docker logout $GCP_REGISTRY
  only:
    - develop

# ====================
# Stage 6: Deploy to Kubernetes
# ====================

.deploy-template: &deploy-template
  stage: deploy
  image: alpine/helm:latest
  before_script:
    # Install kubectl
    - apk add --no-cache curl
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/

    # Configure kubectl
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_CONTENT" > ~/.kube/config
    - chmod 600 ~/.kube/config

    # Verify connection
    - kubectl version --client
    - kubectl cluster-info

# Deploy to OCI Kubernetes (main branch → production)
deploy-oci-prod:
  <<: *deploy-template
  needs:
    - docker-build-oci
  environment:
    name: oci-production
    url: https://techhub.baraq.com
  variables:
    K8S_NAMESPACE: $K8S_NAMESPACE_OCI_DEV
    IMAGE_TAG: $OCI_IMAGE_TAG
  script:
    # Clone deployment configs repo
    - git clone http://gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - cd deployment-configs

    # Deploy using Helm
    - |
      helm upgrade --install techhub ./manifests/techhub \
        --namespace $K8S_NAMESPACE \
        --values manifests/techhub/values-oci-prod.yaml \
        --set image.tag=$CI_COMMIT_SHORT_SHA \
        --set image.repository=$OCI_REGISTRY/$DOCKER_IMAGE_NAME \
        --wait \
        --timeout 5m

    # Verify deployment
    - kubectl rollout status deployment/techhub -n $K8S_NAMESPACE
    - kubectl get pods -n $K8S_NAMESPACE -l app=techhub
  after_script:
    # Send Pushover notification
    - apk add --no-cache curl
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        curl -s --retry 2 --max-time 10 \
          --form-string "token=$PUSHOVER_API_TOKEN" \
          --form-string "user=$PUSHOVER_USER_KEY" \
          --form-string "title=TechHub Deployment Success (OCI)" \
          --form-string "message=✅ Deployed $CI_COMMIT_SHORT_SHA to OCI Kubernetes

      Environment: oci-production
      Namespace: $K8S_NAMESPACE_OCI_DEV
      Duration: $CI_JOB_DURATION seconds
      Pipeline: $CI_PIPELINE_URL" \
          https://api.pushover.net/1/messages.json
      else
        curl -s --retry 2 --max-time 10 \
          --form-string "token=$PUSHOVER_API_TOKEN" \
          --form-string "user=$PUSHOVER_USER_KEY" \
          --form-string "title=TechHub Deployment Failed (OCI)" \
          --form-string "message=❌ Deployment failed

      Environment: oci-production
      Commit: $CI_COMMIT_SHORT_SHA
      Pipeline: $CI_PIPELINE_URL" \
          --form-string "priority=1" \
          https://api.pushover.net/1/messages.json
      fi
  only:
    - main
  when: manual  # Require manual trigger for production deployments

# Deploy to GCP Kubernetes (develop branch → development)
deploy-gcp-dev:
  <<: *deploy-template
  needs:
    - docker-build-gcp
  environment:
    name: gcp-development
    url: https://techhub-dev.baraq.com
  variables:
    K8S_NAMESPACE: $K8S_NAMESPACE_GCP_DEV
    IMAGE_TAG: $GCP_IMAGE_TAG
  script:
    # Clone deployment configs repo
    - git clone http://gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - cd deployment-configs

    # Deploy using Helm (reference existing values like auth-service)
    - |
      helm upgrade --install techhub ./manifests/techhub \
        --namespace $K8S_NAMESPACE \
        --values manifests/techhub/values-dev.yaml \
        --set image.tag=$CI_COMMIT_SHORT_SHA \
        --set image.repository=$GCP_REGISTRY/$DOCKER_IMAGE_NAME \
        --wait \
        --timeout 5m

    # Verify deployment
    - kubectl rollout status deployment/techhub -n $K8S_NAMESPACE
    - kubectl get pods -n $K8S_NAMESPACE -l app=techhub
  after_script:
    # Send Pushover notification
    - apk add --no-cache curl
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        curl -s --form-string "token=$PUSHOVER_API_TOKEN" \
          --form-string "user=$PUSHOVER_USER_KEY" \
          --form-string "title=TechHub Deployment Success (GCP)" \
          --form-string "message=✅ Deployed $CI_COMMIT_SHORT_SHA to GCP Kubernetes

      Environment: gcp-development
      Namespace: $K8S_NAMESPACE_GCP_DEV
      Duration: $CI_JOB_DURATION seconds" \
          https://api.pushover.net/1/messages.json
      fi
  only:
    - develop
  when: on_success  # Auto-deploy to dev environment

# ====================
# Utility Jobs
# ====================

# Manual rollback job (if deployment fails)
rollback:
  stage: deploy
  image: alpine/helm:latest
  variables:
    K8S_NAMESPACE: $K8S_NAMESPACE_OCI_DEV
  before_script:
    - apk add --no-cache curl
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_CONTENT" > ~/.kube/config
  script:
    - helm rollback techhub -n $K8S_NAMESPACE
    - kubectl rollout status deployment/techhub -n $K8S_NAMESPACE
  when: manual
  only:
    - main
    - develop
