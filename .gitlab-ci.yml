    - eval "$(node scripts/release/compute-version.mjs --format=env)"
    - version="${APP_VERSION}"
    - commit_id=`git rev-parse --short=8 HEAD`
    - mkdir -p package
    - cp -r /package/. package/ || echo "No shared packages to copy"
    - mv .dockerignore .dockerignore.tmp
    - echo ".git/" > .dockerignore
    - echo ".npm/" >> .dockerignore
    - echo ".husky/" >> .dockerignore
    - echo "coverage/" >> .dockerignore
    - echo "docs/" >> .dockerignore
    - echo "roadmap/" >> .dockerignore
    - echo "*.md" >> .dockerignore
    - echo ".vscode/" >> .dockerignore
    - echo ".idea/" >> .dockerignore
    - export IMAGE_TAG="${version}-${commit_id}-${CI_JOB_ID}"
    - export FULL_IMAGE_NAME="${DEV_CNTNR_OCI_REG_IMG_PREFIX}/${PROJECT}:${IMAGE_TAG}"
    - |
      /kaniko/executor \
        --cache=true \
        --cache-ttl=168h \
        --snapshot-mode=redo \
        --build-arg BASE_REGISTRY=jed.ocir.io/axbp9ow0rohq \
        --build-arg GIT_COMMIT=${commit_id} \
        --build-arg GIT_COMMIT_FULL=${CI_COMMIT_SHA} \
        --build-arg GIT_REF=${CI_COMMIT_REF_NAME} \
        --build-arg APP_VERSION=${version} \
        --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
        --build-arg IMAGE_TAG=${IMAGE_TAG} \
        --build-arg PIPELINE_ID=${CI_PIPELINE_ID} \
        --build-arg PIPELINE_URL=${CI_PIPELINE_URL} \
        --build-arg GITLAB_JOB_ID=${CI_JOB_ID} \
        --build-arg GITLAB_JOB_URL=${CI_JOB_URL} \
        --build-arg PROJECT_URL=${CI_PROJECT_URL} \
        --context $CI_PROJECT_DIR \
