stages:
  - validate
  - build_only
  - build_and_deploy
  - image-promotion

# ====================
# Stage 1: Validation (Type-check, Lint, Unit Tests)
# ====================
# CRITICAL: This stage MUST run before builds to catch issues early

.validate:
  image: $DEV_OCI_IMAGE
  stage: validate
  tags:
    - $DEV_OCI_LAB_TAG
  cache:
    # Cache based on package-lock.json to invalidate on dependency changes
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
      - .next/cache/
    policy: pull-push
  before_script:
    - cp /.npmrc .
    - echo "📦 Installing dependencies..."
    # Enable pipefail when available to catch npm ci failures (prevents tee from masking errors)
    - set -o pipefail 2>/dev/null || true
    - time npm ci --prefer-offline --cache $NPM_CACHE_DIR 2>&1 | tee npm-install.log
    - echo "✅ Validating Prisma schema..."
    - npx prisma validate
    - npm run db:generate
  script:
    # Validate CRITICAL environment variables only
    # Other vars have defaults (see env.ts and better-auth.ts)
    - echo "Validating critical environment variables..."
    - test -n "$DATABASE_URL" || (echo "❌ ERROR DATABASE_URL not set" && exit 1)
    - test -n "$ENCRYPTION_KEY" || (echo "❌ ERROR ENCRYPTION_KEY not set" && exit 1)
    - echo "✅ Critical environment variables are set"

    # Run type-check, lint, and tests
    - echo "Running type-check..."
    - npm run type-check
    - echo "Running lint..."
    - npm run lint
    - echo "Running tests..."
    - npm run test -- --run --reporter=verbose
    - echo "✅ Validation complete"
  # after_script:
  #   # Track build metrics for monitoring
  #   - echo "📊 Collecting build metrics..."
  #   - echo "Job Duration: ${CI_JOB_DURATION}s" | tee build-metrics.txt
  #   - echo "Pipeline ID: ${CI_PIPELINE_ID}" | tee -a build-metrics.txt
  #   - echo "Commit: ${CI_COMMIT_SHORT_SHA}" | tee -a build-metrics.txt
  #   - echo "Branch: ${CI_COMMIT_BRANCH}" | tee -a build-metrics.txt
  #   - |
  #     if [ -f npm-install.log ]; then
  #       grep "added.*packages" npm-install.log | tee -a build-metrics.txt || echo "npm install time: unavailable" | tee -a build-metrics.txt
  #     fi
  #   - |
  #     if [ -d node_modules ]; then
  #       echo "node_modules size: $(du -sh node_modules | cut -f1)" | tee -a build-metrics.txt
  #     fi
  rules:
    # Run validation on ALL pipelines (not just web/specific branches)
    - when: on_success
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
      - build-metrics.txt
      - npm-install.log
    expire_in: 30 days

# ====================
# Stage 2: Build Only (OCI)
# ====================

build-oci:
  timeout: 20m
  image: $DEV_OCI_IMAGE
  stage: build_only
  variables:
    DOCKER_CONFIG: "/kaniko/.docker"
  cache:
    # Reuse cache from validate stage for faster builds
    key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
      - .next/cache/
    policy: pull
  rules:
    # Automatic: dev branch → build_only
    - if: '$CI_COMMIT_BRANCH == $DEV_BRANCH && $CI_PIPELINE_SOURCE == "push"'
      when: always
    # Manual: Web UI with build_only selected
    - if: '$CLOUD == "oci" && $CI_PIPELINE_SOURCE == "web" && $type == "build_only"'
      when: always
    - when: never
  tags:
    - $DEV_OCI_LAB_TAG
  environment:
    name: $DEV_ENV
  before_script:
    - echo fs.inotify.max_user_watches=524288 | tee -a /etc/sysctl.conf
  script:
    # Clone deployment-configs for Dockerfile
    - git clone --depth 1 http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - cp /.npmrc .

    # Install dependencies and build
    - npm ci --prefer-offline --cache $NPM_CACHE_DIR
    - npm run db:generate
    - npm run build

    # Generate image tag
    - version=`jq -r '.version' package.json`
    - commit_id=`git rev-parse --short=6 HEAD`
    - mkdir -p package
    - cp -r /package/. package/ || echo "No shared packages to copy"

    # Build with Kaniko
    - export IMAGE_TAG="${version}-${commit_id}-${CI_JOB_ID}"
    - export FULL_IMAGE_NAME="${DEV_CNTNR_OCI_REG_IMG_PREFIX}/${PROJECT}:${IMAGE_TAG}"
    - |
      /kaniko/executor \
        --context $CI_PROJECT_DIR \
        --dockerfile Dockerfile \
        --destination ${FULL_IMAGE_NAME}

    - echo "${FULL_IMAGE_NAME}"
  # after_script:
  #   # Track build metrics
  #   - echo "📊 Build Metrics (OCI)" | tee build-size-oci.txt
  #   - echo "Job Duration: ${CI_JOB_DURATION}s" | tee -a build-size-oci.txt
  #   - echo "Pipeline: ${CI_PIPELINE_ID}" | tee -a build-size-oci.txt
  #   - echo "Commit: ${CI_COMMIT_SHORT_SHA}" | tee -a build-size-oci.txt
  #   - |
  #     if [ -d .next ]; then
  #       echo "Next.js build size: $(du -sh .next | cut -f1)" | tee -a build-size-oci.txt
  #       echo "Static files: $(du -sh .next/static 2>/dev/null | cut -f1 || echo 'N/A')" | tee -a build-size-oci.txt
  #     fi
  #   - |
  #     if [ -d node_modules ]; then
  #       echo "node_modules size: $(du -sh node_modules | cut -f1)" | tee -a build-size-oci.txt
  #     fi
  artifacts:
    paths:
      - build-size-oci.txt
    expire_in: 7 days
  # dependencies:
  #   - validate
  needs:
    - job: validate
      artifacts: false

