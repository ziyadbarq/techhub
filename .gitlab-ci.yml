.tag_main_release: &tag_main_release
  stage: release_metadata
  script:
    - git fetch --tags --force
    - git fetch --unshallow || true
    - eval "$(node scripts/release/compute-version.mjs --format=env)"
    - |
      if [ "$RELEASE_NEEDED" != "true" ]; then
        echo "No new semantic version required for this commit range."
        exit 0
      fi
    - |
      if git rev-parse "refs/tags/v${APP_VERSION}" >/dev/null 2>&1; then
        echo "Tag v${APP_VERSION} already exists."
        exit 0
      fi
    - |
      node --input-type=module <<'EOF'
      const releaseVersion = `v${process.env.APP_VERSION}`;
      const endpoint = `${process.env.CI_API_V4_URL}/projects/${process.env.CI_PROJECT_ID}/releases`;
      const body = new URLSearchParams({
        name: releaseVersion,
        tag_name: releaseVersion,
        ref: process.env.CI_COMMIT_SHA,
        description: `Release ${releaseVersion}`,
      });

      const response = await fetch(endpoint, {
        method: "POST",
        headers: {
          "JOB-TOKEN": process.env.CI_JOB_TOKEN,
          "Content-Type": "application/x-www-form-urlencoded",
        },
        body,
      });

      if (!response.ok) {
        const errorBody = await response.text();
        console.error(
          `Failed to create release ${releaseVersion}: ${response.status} ${response.statusText}`,
        );
        console.error(errorBody);
        process.exit(1);
      }

      console.log(`Created release ${releaseVersion} from ${process.env.CI_COMMIT_SHA}`);
      EOF

tag-main-release-gcp:
  <<: *tag_main_release
  image: $DEV_GCP_IMAGE
  tags:
    - $DEV_GCP_LAB_TAG
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CLOUD == "gcp" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy"'
      when: on_success
    - when: never
  dependencies:
    - build-and-push-gcp-to-argo

tag-main-release-oci:
  <<: *tag_main_release
  image: $DEV_OCI_IMAGE
  tags:
    - $DEV_OCI_LAB_TAG
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CLOUD == "oci" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy"'
      when: on_success
    - when: never
  dependencies:
    - build-and-push-oci-to-argo

.promote_to_base: &promote_to_base
  stage: image-promotion
  when: manual
  allow_failure: true
  before_script:
    - |
      if [ -n "$FULL_IMAGE_NAME" ]; then
        echo "Using image from environment: $FULL_IMAGE_NAME"
      elif [ -f build_info.env ]; then
        . build_info.env
        echo "Using image from artifact: $FULL_IMAGE_NAME"
      else
        echo "ERROR: No image found to promote. Make sure build job completed successfully."
        exit 1
      fi
    - echo "$FULL_IMAGE_NAME"
  script:
    - git clone --depth 1 http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - cd deployment-configs && git checkout main
    - git config pull.rebase false
    - git pull http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git
    - export IMAGE_NAME="${FULL_IMAGE_NAME}"
    - yq e -i ".deployment.imageName = strenv(FULL_IMAGE_NAME)" manifests/${PROJECT}/${VALUES_FILE}
    - export PROMOTE_ITAG="${FULL_IMAGE_NAME##*:}"
    - export PROMOTE_VER=$(echo "$PROMOTE_ITAG" | cut -d'-' -f1)
    - export PROMOTE_COMMIT=$(echo "$PROMOTE_ITAG" | cut -d'-' -f2)
    - yq e -i '(.deployment.env[] | select(.name == "GIT_COMMIT")).value = strenv(PROMOTE_COMMIT)' manifests/${PROJECT}/${VALUES_FILE}
    - yq e -i '(.deployment.env[] | select(.name == "APP_VERSION")).value = strenv(PROMOTE_VER)' manifests/${PROJECT}/${VALUES_FILE}
    - yq e -i '(.deployment.env[] | select(.name == "IMAGE_TAG")).value = strenv(PROMOTE_ITAG)' manifests/${PROJECT}/${VALUES_FILE}
    - cat manifests/${PROJECT}/${VALUES_FILE}
    - git config --global user.email "sdev@barq.com"
    - git config --global user.name ${GITLAB_UN}
    - git remote set-url origin "http://${GITLAB_UN}:${GITLAB_TOKEN}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/deployment-configs.git"
    - git add manifests/${PROJECT}/${VALUES_FILE}
    - git commit -m "🚀 Promote ${PROJECT} image to ${TARGET_ENV}"
    - git push origin -o ci.skip HEAD:main

promote-to-uat-oci:
  <<: *promote_to_base
  image: $UAT_OCI_IMAGE
  tags:
    - $UAT_OCI_LAB_TAG
  environment:
    name: uat
  variables:
    VALUES_FILE: $UAT_OCI_VALUES
    TARGET_ENV: "UAT (OCI)"
  rules:
    - if: '$CLOUD == "oci" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy"'
      when: manual
    - when: never
  dependencies:
    - build-and-push-oci-to-argo

promote-to-uat-gcp:
  <<: *promote_to_base
  image: $UAT_GCP_IMAGE
  tags:
    - $UAT_GCP_LAB_TAG
  environment:
    name: uat
  variables:
    VALUES_FILE: $UAT_GCP_VALUES
    TARGET_ENV: "UAT (GCP)"
  rules:
    - if: '$CLOUD == "gcp" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy"'
      when: manual
    - when: never
  dependencies:
    - build-and-push-gcp-to-argo
