# TechHub CI/CD
#
# Next.js 16 + Prisma 7. Jobs, runner tags and GitOps targets come from
# profiles/node.yml. This stub only sets identity and the values that differ
# from vars/base.yml + vars/node.yml.
include:
  - project: 'baraq-engineering/devops/ci-templates'
    ref: 'main'
    file:
      - '/templates/profiles/node.yml'

variables:
  PROJECT: "techhub"
  REPO_URL: "git@gitlab.dev.baraq.com.internal:baraq-engineering/webdev/techhub.git"

  # Live Argo is GCP (argocd-gcp/apps/dev/horizontal-services/techhub.yaml).
  CLOUD:
    description: "Select on which cloud you need to deploy"
    value: "gcp"
    options:
      - "gcp"
      - "oci"

  type:
    description: "select your desired operation"
    value: "build_and_deploy"
    options:
      - "build_only"
      - "build_and_deploy"

  # deployment-configs clone uses GITLAB_UN/GITLAB_TOKEN from the web-dev group.
  # Do not alias GITLAB_UN_VAL here — _VAL only has values-yaml-npd access.
  # GCP GitOps still uses _VAL via GCP_GITOPS_* defaults in ci-templates vars/base.yml.

  # In-repo Dockerfile expects npm ci + prisma generate + next build:fast on the
  # runner, then copies .next / prisma / node_modules. Shared Nest-style
  # Dockerfiles from deployment-configs cannot package that output.
  POST_DOCKERFILE_PREPARE_CMD: "cp Dockerfile \"${OCI_DOCKERFILE}\"; cp Dockerfile \"${GCP_DOCKERFILE}\""

  NODE_PACKAGE_MANAGER: "npm"
  NODE_NPM_INSTALL_CMD: "npm ci --prefer-offline --cache $NPM_CACHE_DIR --legacy-peer-deps"
  # package.json version is 1.0.0; image tags use scripts/release/compute-version.mjs.
  # $$ so GitLab does not expand these before the job shell runs.
  NODE_NPM_BUILD_CMD: "git fetch --tags --force; git fetch --unshallow || true; eval \"$$(node scripts/release/compute-version.mjs --format=env)\"; npm pkg set version=\"$$APP_VERSION\"; npm run db:generate && npm run build:fast"

  # Dockerfile copies pre-built .next + node_modules from kaniko context. Repo .dockerignore
  # excludes node_modules/ for local builds; legacy pipeline swapped it before kaniko.
  NODE_PACKAGE_PREPARE_CMD: |
    mv .dockerignore .dockerignore.tmp
    printf '%s\n' '.git/' '.npm/' '.husky/' 'coverage/' 'docs/' 'roadmap/' '*.md' '.vscode/' '.idea/' > .dockerignore

  # engines.node >= 22. OCI jobs also run on globalnodegcp, so DEV_OCI_IMAGE must be GAR.
  DEV_GCP_IMAGE: "me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo/gitlab-runner-node-22-alpine:latest"
  DEV_OCI_IMAGE: "me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo/gitlab-runner-node-22-alpine:latest"
  SONAR_REPORT_IMAGE: "me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo/gitlab-runner-node-22-alpine:latest"
  CT_IMAGE: "me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo/gitlab-runner-node-22-alpine:latest"

  PERF_CNTNR_OCI_REG_IMG_PREFIX: "jed.ocir.io/axbp9ow0rohq"
  PERF_OCI_LAB_TAG: globalnodeoci
  PERF_OCI_VALUES: values-perf.yaml
  PERF_OCI_IMAGE: jed.ocir.io/axbp9ow0rohq/gitlab-runner-node-22-alpine

  # GCP
  DEV_CNTNR_GCP_REG_IMG_PREFIX: "me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo"
  DEV_GCP_LAB_TAG: globalnodegcp
  DEV_GCP_VALUES: values-gcpdev.yaml
  DEV_GCP_IMAGE: me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo/gitlab-runner-node-22-alpine:latest

  UAT_CNTNR_GCP_REG_IMG_PREFIX: "me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo"
  UAT_GCP_LAB_TAG: globalnodegcp
  UAT_GCP_VALUES: values-gcpuat.yaml
  UAT_GCP_IMAGE: me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo/gitlab-runner-node-22-alpine:latest

stages:
  - validate
  - build_only
  - build_and_deploy
  - release_metadata
  - image-promotion

workflow:
  rules:
    # Manual only — Run pipeline in GitLab UI. No pipelines on git push.
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never

.build_cache: &build_cache
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .npm/
    - .next/cache/
  policy: pull-push

.build_metrics_after_script: &build_metrics_after_script
  - echo "Job Duration:${CI_JOB_DURATION}s" | tee -a ${BUILD_METRICS_FILE}
  - echo "Pipeline:${CI_PIPELINE_ID}" | tee -a ${BUILD_METRICS_FILE}
  - echo "Commit:${CI_COMMIT_SHORT_SHA}" | tee -a ${BUILD_METRICS_FILE}
  - if [ -d .next ]; then echo "Next.js build size:$(du -sh .next | cut -f1)" | tee -a ${BUILD_METRICS_FILE}; echo "Static files:$(du -sh .next/static 2>/dev/null | cut -f1 || echo N/A)" | tee -a ${BUILD_METRICS_FILE}; fi
  - if [ -d node_modules ]; then echo "node_modules size:$(du -sh node_modules | cut -f1)" | tee -a ${BUILD_METRICS_FILE}; fi

# Quality gate: type-check + lint + unit tests (mirrors `npm run validate`).
# Runs before any build job; a failure stops the pipeline, so broken types
# or tests can no longer reach an image build (builds use build:fast, which
# skips type checking by design).
.validate_script: &validate_script
  - cp /.npmrc .
  - npm ci $NPM_CI_FLAGS
  - npm run db:generate
  - npm run type-check
  - npm run lint
  - npm run check:guards
  - npx vitest --run

validate-gcp:
  timeout: 30m
  image: $DEV_GCP_IMAGE
  stage: validate
  cache:
    <<: *build_cache
  rules:
    - if: '$CLOUD == "gcp" && $CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
    - when: never
  tags:
    - $DEV_GCP_LAB_TAG
  script: *validate_script

validate-oci:
  timeout: 30m
  image: $DEV_OCI_IMAGE
  stage: validate
  cache:
    <<: *build_cache
  rules:
    - if: '$CLOUD == "oci" && $CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: false
    - when: never
  tags:
    - $DEV_OCI_LAB_TAG
  script: *validate_script
# Public Next.js vars are inlined at build time. Next builds often exceed the
# template's 20m timeout. BASE_REGISTRY must match the destination cloud's node:22-alpine.
build-and-push-gcp-to-argo:
  timeout: 30m
  variables:
    NEXT_PUBLIC_APP_URL: "https://techhub.dev.barq.com"
    NODE_KANIKO_BUILD_ARGS: "--build-arg BASE_REGISTRY=me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo"

build-gcp:
  timeout: 30m
  variables:
    NEXT_PUBLIC_APP_URL: "https://techhub.dev.barq.com"
  cache:
    <<: *build_cache
  rules:
    - if: '$CLOUD == "gcp" && $CI_PIPELINE_SOURCE == "web" && $type == "build_only"'
      when: always
    - when: never
  tags:
    - $DEV_GCP_LAB_TAG
  environment:
    name: $DEV_ENV
  before_script:
    - echo fs.inotify.max_user_watches=524288 | tee -a /etc/sysctl.conf
    - echo fs.inotify.max_user_instances=512 | tee -a /etc/sysctl.conf
    - sysctl -p
  script:
    - cp /.npmrc .
    - npm ci $NPM_CI_FLAGS
    - npm run db:generate
    - npm run build:fast
    - git fetch --tags --force
    - git fetch --unshallow || true
    - eval "$(node scripts/release/compute-version.mjs --format=env)"
    - version="${APP_VERSION}"
    - commit_id=`git rev-parse --short=8 HEAD`
    - mkdir -p package
    - cp -r /package/. package/ || echo "No shared packages to copy"
    - mv .dockerignore .dockerignore.tmp
    - echo ".git/" > .dockerignore
    - echo ".npm/" >> .dockerignore
    - echo ".husky/" >> .dockerignore
    - echo "coverage/" >> .dockerignore
    - echo "docs/" >> .dockerignore
    - echo "roadmap/" >> .dockerignore
    - echo "*.md" >> .dockerignore
    - echo ".vscode/" >> .dockerignore
    - echo ".idea/" >> .dockerignore
    - export IMAGE_TAG="${version}-${commit_id}-${CI_JOB_ID}"
    - export FULL_IMAGE_NAME="${DEV_CNTNR_GCP_REG_IMG_PREFIX}/${PROJECT}:${IMAGE_TAG}"
    - |
      /kaniko/executor \
        --cache=true \
        --cache-ttl=168h \
        --snapshot-mode=redo \
        --build-arg BASE_REGISTRY=me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo \
        --build-arg GIT_COMMIT=${commit_id} \
        --build-arg GIT_COMMIT_FULL=${CI_COMMIT_SHA} \
        --build-arg GIT_REF=${CI_COMMIT_REF_NAME} \
        --build-arg APP_VERSION=${version} \
        --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
        --build-arg IMAGE_TAG=${IMAGE_TAG} \
        --build-arg PIPELINE_ID=${CI_PIPELINE_ID} \
        --build-arg PIPELINE_URL=${CI_PIPELINE_URL} \
        --build-arg GITLAB_JOB_ID=${CI_JOB_ID} \
        --build-arg GITLAB_JOB_URL=${CI_JOB_URL} \
        --build-arg PROJECT_URL=${CI_PROJECT_URL} \
        --context $CI_PROJECT_DIR \
        --dockerfile Dockerfile \
        --destination ${FULL_IMAGE_NAME}
    - mv .dockerignore.tmp .dockerignore
    - echo "📊 Build Metrics (GCP)" | tee ${BUILD_METRICS_FILE}
    - echo "${FULL_IMAGE_NAME}"
  after_script: *build_metrics_after_script
  artifacts:
    paths:
      - build-size-gcp.txt
    expire_in: 7 days

build-oci:
  timeout: 30m
  image: $DEV_OCI_IMAGE
  stage: build_only
  variables:
    DOCKER_CONFIG: "/kaniko/.docker"
    BUILD_METRICS_FILE: "build-size-oci.txt"
  cache:
    <<: *build_cache
  rules:
    - if: '$CLOUD == "oci" && $CI_PIPELINE_SOURCE == "web" && $type == "build_only"'
      when: always
    - when: never
  tags:
    - $DEV_OCI_LAB_TAG
  environment:
    name: $DEV_ENV
  before_script:
    - echo fs.inotify.max_user_watches=524288 | tee -a /etc/sysctl.conf
  script:
    - cp /.npmrc .
    - npm ci $NPM_CI_FLAGS
    - npm run db:generate
    - npm run build:fast
    - git fetch --tags --force
    - git fetch --unshallow || true
    - eval "$(node scripts/release/compute-version.mjs --format=env)"
    - version="${APP_VERSION}"
    - commit_id=`git rev-parse --short=8 HEAD`
    - mkdir -p package
    - cp -r /package/. package/ || echo "No shared packages to copy"
    - mv .dockerignore .dockerignore.tmp
    - echo ".git/" > .dockerignore
    - echo ".npm/" >> .dockerignore
    - echo ".husky/" >> .dockerignore
    - echo "coverage/" >> .dockerignore
    - echo "docs/" >> .dockerignore
    - echo "roadmap/" >> .dockerignore
    - echo "*.md" >> .dockerignore
    - echo ".vscode/" >> .dockerignore
    - echo ".idea/" >> .dockerignore
    - export IMAGE_TAG="${version}-${commit_id}-${CI_JOB_ID}"
    - export FULL_IMAGE_NAME="${DEV_CNTNR_OCI_REG_IMG_PREFIX}/${PROJECT}:${IMAGE_TAG}"
    - |
      /kaniko/executor \
        --cache=true \
        --cache-ttl=168h \
        --snapshot-mode=redo \
        --build-arg BASE_REGISTRY=jed.ocir.io/axbp9ow0rohq \
        --build-arg GIT_COMMIT=${commit_id} \
        --build-arg GIT_COMMIT_FULL=${CI_COMMIT_SHA} \
        --build-arg GIT_REF=${CI_COMMIT_REF_NAME} \
        --build-arg APP_VERSION=${version} \
        --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
        --build-arg IMAGE_TAG=${IMAGE_TAG} \
        --build-arg PIPELINE_ID=${CI_PIPELINE_ID} \
        --build-arg PIPELINE_URL=${CI_PIPELINE_URL} \
        --build-arg GITLAB_JOB_ID=${CI_JOB_ID} \
        --build-arg GITLAB_JOB_URL=${CI_JOB_URL} \
        --build-arg PROJECT_URL=${CI_PROJECT_URL} \
        --context $CI_PROJECT_DIR \
        --dockerfile Dockerfile \
        --destination ${FULL_IMAGE_NAME}
    - mv .dockerignore.tmp .dockerignore
    - echo "📊 Build Metrics (OCI)" | tee ${BUILD_METRICS_FILE}
    - echo "${FULL_IMAGE_NAME}"
  after_script: *build_metrics_after_script
  artifacts:
    paths:
      - build-size-oci.txt
    expire_in: 7 days

build-and-push-gcp-to-argo:
  timeout: 30m
  image: $DEV_GCP_IMAGE
  stage: build_and_deploy
  variables:
    DOCKER_CONFIG: "/kaniko/.docker"
    NEXT_PUBLIC_APP_URL: "https://techhub.dev.barq.com"
  cache:
    <<: *build_cache
  rules:
    - if: '$CLOUD == "gcp" && $CI_PIPELINE_SOURCE == "web" && $type == "build_and_deploy"'
      when: always
    - when: never
  tags:
    - $DEV_GCP_LAB_TAG
  environment:
    name: $DEV_ENV
  before_script:
    - echo fs.inotify.max_user_watches=524288 | tee -a /etc/sysctl.conf
    - echo fs.inotify.max_user_instances=512 | tee -a /etc/sysctl.conf
    - sysctl -p
  script:
    - cp /.npmrc .
    - npm ci $NPM_CI_FLAGS
    - npm run db:generate
    - npm run build:fast
    - git fetch --tags --force
    - git fetch --unshallow || true
    - eval "$(node scripts/release/compute-version.mjs --format=env)"
    - version="${APP_VERSION}"
    - commit_id=`git rev-parse --short=8 HEAD`
    - mkdir -p package
    - cp -r /package/. package/ || echo "No shared packages to copy"
    - export IMAGE_TAG="${version}-${commit_id}-${CI_JOB_ID}"
    - export FULL_IMAGE_NAME="${DEV_CNTNR_GCP_REG_IMG_PREFIX}/${PROJECT}:${IMAGE_TAG}"
    - export IMAGE_NAME="${FULL_IMAGE_NAME}"
    - git clone --depth 1 http://${GITLAB_UN_VAL}:${GITLAB_TOKEN_VAL}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/values-yaml-npd.git
    - cd values-yaml-npd
    - export COMMIT_ID="${commit_id}" APP_VER="${version}" ITAG="${IMAGE_TAG}"
    - git config --global user.email "sdev@barq.com"
    - git config --global user.name ${GITLAB_UN_VAL}
    - git remote set-url origin "http://${GITLAB_UN_VAL}:${GITLAB_TOKEN_VAL}@gitlab.dev.baraq.com.internal/baraq-engineering/devops/values-yaml-npd.git"
    - |
      for attempt in 1 2 3; do
        git fetch origin main
        git reset --hard origin/main

        yq e -i ".deployment.imageName = strenv(IMAGE_NAME)" ${PROJECT}/${DEV_GCP_VALUES}
        yq e -i '(.deployment.env[] | select(.name == "GIT_COMMIT")).value = strenv(COMMIT_ID)' ${PROJECT}/${DEV_GCP_VALUES}
        yq e -i '(.deployment.env[] | select(.name == "APP_VERSION")).value = strenv(APP_VER)' ${PROJECT}/${DEV_GCP_VALUES}
        yq e -i '(.deployment.env[] | select(.name == "IMAGE_TAG")).value = strenv(ITAG)' ${PROJECT}/${DEV_GCP_VALUES}
        cat ${PROJECT}/${DEV_GCP_VALUES}

        git add ${PROJECT}/${DEV_GCP_VALUES}
        git commit -m "🚀 Update ${PROJECT} DEV image to ${IMAGE_TAG}"

        if git push origin -o ci.skip HEAD:main; then
          break
        fi

        if [ "$attempt" -eq 3 ]; then
          echo "Failed to push ${PROJECT}/${DEV_GCP_VALUES} after ${attempt} attempts"
          exit 1
        fi

        sleep $((attempt * 5))
      done
    - cd $CI_PROJECT_DIR
    - mv .dockerignore .dockerignore.tmp
    - echo ".git/" > .dockerignore
    - echo ".npm/" >> .dockerignore
    - echo ".husky/" >> .dockerignore
    - echo "coverage/" >> .dockerignore
    - echo "docs/" >> .dockerignore
    - echo "roadmap/" >> .dockerignore
    - echo "*.md" >> .dockerignore
    - echo ".vscode/" >> .dockerignore
    - echo ".idea/" >> .dockerignore
    - |
      /kaniko/executor \
        --cache=true \
        --cache-ttl=168h \
        --snapshot-mode=redo \
        --build-arg BASE_REGISTRY=me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo \
        --build-arg GIT_COMMIT=${commit_id} \
        --build-arg GIT_COMMIT_FULL=${CI_COMMIT_SHA} \
        --build-arg GIT_REF=${CI_COMMIT_REF_NAME} \
        --build-arg APP_VERSION=${version} \
        --build-arg BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
        --build-arg IMAGE_TAG=${IMAGE_TAG} \
        --build-arg PIPELINE_ID=${CI_PIPELINE_ID} \
        --build-arg PIPELINE_URL=${CI_PIPELINE_URL} \
        --build-arg GITLAB_JOB_ID=${CI_JOB_ID} \
        --build-arg GITLAB_JOB_URL=${CI_JOB_URL} \
        --build-arg PROJECT_URL=${CI_PROJECT_URL} \
        --context $CI_PROJECT_DIR \
        --dockerfile Dockerfile \
        --destination ${FULL_IMAGE_NAME}
    - mv .dockerignore.tmp .dockerignore
    - echo "${FULL_IMAGE_NAME}"
    - echo "FULL_IMAGE_NAME=${FULL_IMAGE_NAME}" > build_info.env
    - echo "IMAGE_FOR_UAT=${FULL_IMAGE_NAME}" >> build_info.env
  artifacts:
    reports:
      dotenv: build_info.env
    paths:
      - build_info.env
    expire_in: 1 week
    NODE_KANIKO_BUILD_ARGS: "--build-arg BASE_REGISTRY=me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo"

build-and-push-oci-to-argo:
  timeout: 30m
  variables:
    NODE_KANIKO_BUILD_ARGS: "--build-arg BASE_REGISTRY=jed.ocir.io/axbp9ow0rohq"

build-oci:
  timeout: 30m
  variables:
    NODE_KANIKO_BUILD_ARGS: "--build-arg BASE_REGISTRY=jed.ocir.io/axbp9ow0rohq"
