# Modify the values as per you application
namespace: horizontal-services
applicationName: "techhub"
environment: "dev"
#Configmap
gcpSchemaSa:
  enabled: true
  configMapName: "gcp-schema-sa"
  mountPath: "/mnt/gcpsa"
  key: "sa-decoded.json"
  readOnly: true
# Istio AuthorizationPolicy Configuration
authorizationPolicy:
  enabled: false
# Service Account Configuration
serviceAccount:
  enabled: true
  name: techhub-sa
  annotations:
    iam.gke.io/gcp-service-account: kafka-dev-sa@gcp-brq-app-dev-prj-bc87.iam.gserviceaccount.com
hostAliases:
  enabled: true
  entries:
    # Internal services
    - hostnames:
        - gitlab.dev.baraq.com.internal
      ip: 10.100.1.191
istio:
  enabled: true
  targetHost:
    - istio-ingress.dev.barq.com
    - istio-ingressgateway.istio-system.svc.cluster.local
    - techhub-svc.personal-accounts.svc.cluster.local
  gateway:
    - gateway/https-dev-ingress-gateway
    - mesh
  hostname: techhub-svc.personal-accounts.svc.cluster.local
  path: /th/
  label: primary
  weight: 100
  retries: {}
priorityClass:
  enabled: false
  name: critical-apps # Choose from: overprovisioning, normal-apps, critical-apps
timeout:
  enabled: false
pdb:
  enabled: false
  minAvailable: 1
secrets:
  enabled: true
  cssname: gcp-cluster-secret-store-new
  prime:
    enabled: false
# Enable or disable the seeker-agent sidecar and its volumeMount/volume
seekerAgent:
  enabled: false
monitoring:
  enabled: false
rollout:
  enabled: true
  stableService: techhub-svc
  canaryService: techhub-canary-svc
  trafficRouting:
    istio:
      enabled: true
  steps:
    - setWeight: 5
    - pause: {duration: 1s}
    - setWeight: 10
    - pause: {duration: 1s}
    - setWeight: 25
    - pause: {duration: 1s}
    - setWeight: 50
    - pause: {duration: 1s}
deployment:
  replicaCount: 3
  imageName: me-central2-docker.pkg.dev/gcp-brq-shd-prd-prj-74ba/gcp-brq-docker-repo/techhub:1.5.0-c24370-187320
  imagePullPolicy: IfNotPresent
  imagePullSecrets: {}
  terminationGracePeriodSeconds: 90
  # Config server + fallback env (config server overrides when reachable)
  env:
    - name: CONFIG_SERVER_URL
      value: http://config-server-svc.horizontal-services.svc.cluster.local:8083
    - name: APPLICATION_NAME
      value: techhub
    - name: ENVIRONMENT_NAME
      value: gcpdev
    - name: SPRING_PROFILE
      value: gcpdev
    - name: NODE_ENV
      value: "production"
    - name: GIT_COMMIT
      value: "f7b9c6e0"
    - name: APP_VERSION
      value: "1.5.0"
    - name: IMAGE_TAG
      value: "1.5.0-f7b9c6e0-185665"
    # - name: HOST
    #   value: "0.0.0.0"
    # Fallback so app starts if config server is unreachable; config server overrides when loaded
    # - name: DATABASE_URL
    #   value: "postgresql://techhub:YG%3C2KH%60r%29I%2CkHjMO@172.17.19.3:5432/techhub"
    - name: REDIS_URL
      value: redis://redis.dev.barq.com:6379
    # - name: ENCRYPTION_KEY
    #   value: "0ba0bf6dea177b8442c5fed421d0fbda50eb415e73deefd975e9a5775e8564cc"
    # - name: BETTER_AUTH_SECRET
    #   value: "XmPMOa+T2AUH13vPJqJoAllUC6njO9RwkFdYJpYWdNE="
    - name: NEXT_PUBLIC_APP_URL
      value: "https://techhub.dev.barq.com"
    - name: BETTER_AUTH_URL
      value: "https://techhub.dev.barq.com"
    - name: TRUSTED_ORIGINS
      value: "https://techhub.dev.barq.com"
    - name: LOG_LEVEL
      value: "debug"
    - name: PRISMA_VERBOSE_LOGS
      value: "true"
    - name: AUTH_DEBUG_LOGS
      value: "true"
    - name: ALLOW_ENV_DEBUG
      value: "true"
      # TechHub Attachments - Google Cloud Storage
    - name: GCS_BUCKET_NAME
      value: "gcp-barq-app-dev-website-private"
    - name: GCS_ATTACHMENTS_PREFIX
      value: "techhub-it-asset-attachments-dev"
      # Synopsys Integration
  # - name: SEEKER_SERVER_URL
  #   value: "https://10.100.1.98:8443"
  # - name: SEEKER_PROJECT_KEY
  #   value: "techhub-gcp"
  # - name: NODE_OPTIONS
  #   value: "-r /opt/app/package/index.js"
  lifecycle:
    preStop:
      exec:
        command:
          - /bin/sleep
          - "30"
  startupProbe:
    httpGet:
      path: /health
      port: 3000
    failureThreshold: 30
    timeoutSeconds: 3
    periodSeconds: 30
  livenessProbe:
    httpGet:
      path: /health
      port: 3000
    failureThreshold: 12
    timeoutSeconds: 5
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /health
      port: 3000
    timeoutSeconds: 5
    periodSeconds: 30
  resources:
    limits:
      memory: 4000Mi
    requests:
      cpu: 100m
      memory: 200Mi
  podAnnotations:
    proxy.istio.io/config: '{ "holdApplicationUntilProxyStarts": true }'
service:
  type: LoadBalancer
  port: 3000
  annotations:
    cloud.google.com/load-balancer-type: Internal
    networking.gke.io/internal-load-balancer-subnet: gcp-brq-app-lb-dev-sub-mec2-pvt
podSecurityContext: {}
# fsGroup: 2000

securityContext:
  allowPrivilegeEscalation: false
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
#   targetMemoryUtilizationPercentage: 60

# Enable or disable the network policy
networkPolicy:
  enabled: false
  policy:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: techhub
jobs:
  migrate:
    enabled: false
    command: "node docker-start.mjs"
    resources:
      limits:
        memory: 1024Mi
      requests:
        cpu: 200m
        memory: 512Mi
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: techhub
    nodeTaintsPolicy: Honor
    nodeAffinityPolicy: Honor
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: techhub
          topologyKey: topology.kubernetes.io/zone
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node_pool
              operator: In
              values:
                - app-dev-app-1a
                - app-dev-app-1b
                - app-dev-app-1c
            - key: topology.kubernetes.io/zone
              operator: In
              values:
                - me-central2-a
                - me-central2-b
                - me-central2-c
tolerations:
  - key: "workload"
    operator: "Equal"
    value: "app"
    effect: "NoSchedule"
